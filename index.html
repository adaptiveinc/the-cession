<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cession</title>
<style>
  :root{
    --ink:#0e141c; --panel:#161e29; --panel2:#1c2634; --line:#28344455;
    --text:#e7ecf3; --muted:#8b98aa; --faint:#5d6b7e;
    --gold:#d9a648; --gold-dim:#d9a64822; --cyan:#72b7cc; --green:#63b380;
    --red:#e06a5e; --red-dim:#e06a5e1c; --green-dim:#63b3801f;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--ink)}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
  ::selection{background:var(--gold);color:#10151c}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

  /* ---------------- HUD ---------------- */
  #hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 200px 12px 18px;
    border-bottom:1px solid var(--line);background:#0e141cf5;position:sticky;top:0;z-index:40}
  #hud .brand{font-family:var(--serif);font-size:17px;white-space:nowrap;cursor:pointer}
  #hud .brand:hover em{color:var(--text)}
  #hud .brand:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
  #hud .brand em{font-style:italic;color:var(--gold)}
  #hud .where{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint)}
  .dirbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--cyan);border:1px solid #72b7cc44;border-radius:6px;padding:3px 10px;transition:background .15s}
  .dirbtn:hover{background:#72b7cc1a}
  #ledgerchips{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
  .chip{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--faint)}
  .chip b{font-family:var(--mono);font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
  .chip.hot b{color:var(--gold)} .chip.neg b{color:var(--red)}
  .chip.flash{animation:chipflash .8s ease}
  @keyframes chipflash{0%{background:var(--gold-dim)}100%{background:transparent}}
  #audit{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);position:absolute;top:16px;right:18px}
  #audit .bar{width:80px;height:5px;border-radius:3px;background:#232e3d;overflow:hidden}
  #audit .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e8c273);transition:width .5s}
  #audit b{font-family:var(--mono);color:var(--text)}
  #audit{cursor:pointer}
  .books-callout{position:absolute;top:calc(100% + 10px);right:14px;z-index:80;width:300px;background:var(--gold);color:#131a24;
    font-size:13px;line-height:1.45;padding:11px 15px;border-radius:10px;box-shadow:0 6px 24px #00000060;
    cursor:pointer;animation:calloutIn .4s ease, calloutBob 2.2s ease-in-out .4s infinite}
  .books-callout::before{content:'';position:absolute;top:-8px;right:44px;border:8px solid transparent;border-top:none;border-bottom-color:var(--gold)}
  .books-callout b{display:block;margin-bottom:2px;padding-right:16px}
  .books-callout{cursor:pointer}
  .books-callout .bc-x{position:absolute;top:3px;right:7px;font-size:16px;line-height:1;color:inherit;opacity:.65;background:none;border:none;cursor:pointer;padding:2px}
  .books-callout .bc-x:hover{opacity:1}
  [data-theme="light"] .books-callout{color:#ffffff}
  @keyframes calloutIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes calloutBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  @media(prefers-reduced-motion:reduce){.books-callout{animation:calloutIn .4s ease}}
  .chip{cursor:pointer;border-radius:5px;padding:1px 5px;margin:-1px -5px}
  .chip:hover{background:#ffffff0d}
  .finding{border-top:1px solid var(--line);padding:9px 0 7px}
  .fhead{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
  .fq{font-size:13.5px;color:#d5dde8}
  .fa{font-size:12.5px;color:#e8907f;margin-top:2px}
  .fl{font-size:12.5px;color:var(--green);margin-top:5px;font-weight:600}
  .fy{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .roll{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  .roll th{text-align:left;color:var(--faint);font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
  .roll td{padding:5px 6px;border-bottom:1px solid #28344433;color:#c9d3df;vertical-align:top}
  .roll .tn{color:var(--faint);font-family:var(--mono);font-size:10.5px}
  .roll .td{font-family:var(--mono);text-align:right;white-space:nowrap}
  .roll .td.pos{color:var(--green)} .roll .td.neg{color:var(--red)}
  .roll .tb{font-family:var(--mono);text-align:right;color:var(--text)}
  .troom{color:var(--faint);font-size:11px}

  .chip:focus-visible,#audit:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:5px}
  /* the quiz button flashes while the capstone file is the pending next step */
  #quizBtn.urge{animation:nextflash 1.2s ease-in-out infinite;border-color:#d9a64888}
  @media(prefers-reduced-motion:reduce){#quizBtn.urge{animation:none;background:var(--gold-dim)}}
  /* ---------------- stage ---------------- */
  #stage{max-width:1150px;margin:0 auto;padding:14px 14px 60px}
  .fadein{animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){.fadein{animation:none}}

  /* ---------------- hero ---------------- */
  .hero{padding:64px 10px 30px;max-width:660px}
  .hero .kicker{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
  .hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6vw,56px);line-height:1.08;margin:14px 0 16px;text-wrap:balance}
  .hero h1 em{font-style:italic;color:var(--gold)}
  .hero p{color:var(--muted);font-size:16px;max-width:54ch}
  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  .cta{border:1px solid #d9a64866;color:var(--gold);border-radius:7px;padding:9px 20px;font-size:14px;transition:background .15s}
  .cta:hover{background:var(--gold-dim)}
  .cta.big{background:var(--gold);color:#131a24;border:none;font-weight:600;font-size:15px;padding:12px 26px}
  .cta.big:hover{background:#e5b95f}
  .cta.ghost{border-color:var(--line);color:var(--muted)}

  /* ---------------- scene ---------------- */
  .scene{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0c1118}
  .scene svg{display:block;width:100%;height:auto}
  /* scenes mount inside .scenewrap; on small portrait screens it becomes a swipeable viewport */
  .scenewrap{overflow:hidden}
  @media(max-width:740px) and (orientation:portrait){
    .scenewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .scenewrap::-webkit-scrollbar{display:none}
    .scenewrap svg{height:62vh;width:auto;max-width:none}
  }
  .scene-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none}
  .scene-top>*{pointer-events:auto}
  .stl{display:flex;gap:10px;align-items:flex-start}
  /* the room's own nameplate: only wanted where the HUD breadcrumb is hidden */
  .roomtag{display:none}
  .backbtn{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 12px;background:#0e141cd9}
  .backbtn:hover{color:var(--text);border-color:var(--faint)}
  .objective{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--muted);
    background:#0e141cd9;border:1px solid var(--line);border-radius:6px;padding:6px 11px;text-align:right}
  .objective b{color:var(--gold)}

  /* dialogue bar */
  .dlg{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:12px;align-items:flex-start;
    background:#10161ff0;border:1px solid #2c394a;border-radius:12px;padding:13px 16px;backdrop-filter:blur(4px);
    animation:dlgup .35s ease}
  @keyframes dlgup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .dlg .pv{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-family:var(--mono);font-size:12px;font-weight:700}
  .pv.ph{background:#173340;color:var(--cyan);border:1px solid #72b7cc44}
  .pv.act{background:#33290f;color:var(--gold);border:1px solid #d9a64844}
  .pv.aud{background:#3a1f1c;color:var(--red);border:1px solid #e06a5e44}
  .pv.sys{background:#1d2734;color:var(--muted);border:1px solid var(--line)}
  .pv.uw{background:#232e3d;color:#aeb9c9;border:1px solid #8b98aa44}
  .pv.you{background:#33290f;color:var(--gold);border:1px solid #d9a64866}
  .memo{font-size:13px;color:var(--muted);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:9px 13px;margin:2px 0 4px;line-height:1.6}
  .memo b{color:var(--text);font-family:var(--mono);font-weight:600}
  .dlg .txt{flex:1;min-width:0}
  .dlg .who{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:3px}
  .dlg p{color:#d5dde8;font-size:14.5px}
  .dlg .num{font-family:var(--mono);color:var(--gold)}
  .dlg .next{flex:none;align-self:flex-end;border:1px solid #d9a64866;color:var(--gold);border-radius:6px;padding:6px 14px;font-size:12.5px;
    animation:nextflash 1.2s ease-in-out infinite}
  .dlg .next:hover{background:var(--gold-dim);animation:none}
  @keyframes nextflash{0%,100%{background:transparent;box-shadow:none}50%{background:var(--gold-dim);box-shadow:0 0 0 3px #d9a64833}}
  @media(prefers-reduced-motion:reduce){.dlg .next{animation:none;background:var(--gold-dim)}}
  /* while a conversation is open, the door button steps aside and the hotspots stop
     pulsing: the flashing thing on screen is the Next button */
  .scene:has(.dlg) > .cta.big,
  .scene:has(.dlg) > .doorrow,
  .scene:has(.dlg) > .scenepan{opacity:0;pointer-events:none}
  .scene > .cta.big,.scene > .doorrow{transition:opacity .25s}
  .scene:has(.dlg) .hs .pulse{display:none}
  .scene:has(.dlg) .hs.next .ring,.scene:has(.dlg) .hs.next .halo{animation:none}
  .scene:has(.dlg) .hs.next .halo{opacity:0}

  /* hotspots inside svg */
  .hs{cursor:pointer}
  .hs .ring{fill:#0e141c;stroke:var(--gold);stroke-width:1.5;opacity:.92}
  .hs text{fill:var(--gold);font-family:var(--mono);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
  .hs.q .ring{stroke:var(--cyan)} .hs.q text{fill:var(--cyan)}
  .hs .pulse{fill:none;stroke:var(--gold);opacity:.7;animation:pulse 2s ease-out infinite}
  .hs.q .pulse{stroke:var(--cyan)}
  @keyframes pulse{from{transform:scale(.6);opacity:.8}to{transform:scale(1.9);opacity:0}}
  .hs.done .ring{stroke:var(--green)} .hs.done text{fill:var(--green)}
  .hs.done .pulse{display:none}
  .hs .cap{font-size:10.5px;letter-spacing:1.6px;font-weight:600;paint-order:stroke;stroke:#0e141c;stroke-width:3px}
  .hs:focus{outline:none}
  .hs:focus-visible .halo{fill:var(--gold);opacity:.28}
  .hs:focus-visible .ring{stroke:var(--gold);stroke-width:3}
  .hs .tick{display:none}
  .hs.done .glyph{display:none}
  .hs.done .tick{display:block}
  .hs .halo{fill:var(--gold);opacity:0;transform-box:fill-box;transform-origin:center}
  .hs .evcard text{fill:var(--text);font-family:var(--sans);font-size:14px;font-weight:400;letter-spacing:0;text-anchor:middle;dominant-baseline:auto}
  .hs .evcard text.hdr{fill:var(--gold);font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px}
  .hs.q .halo{fill:var(--cyan)}
  .hs.next .halo{animation:halo 1.1s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.5;transform:scale(1.6)}}
  .hs.next .pulse{animation-duration:1.1s}
  .hs.next .ring{animation:hsFlash 1.1s ease-in-out infinite}
  @keyframes hsFlash{0%,100%{stroke-width:2}50%{stroke-width:5.5}}
  .hs.next .cap{font-size:11.5px}
  @media(prefers-reduced-motion:reduce){.hs.next .ring,.hs.next .halo{animation:none}.hs.next .halo{opacity:.3}}
  @media(prefers-reduced-motion:reduce){.hs .pulse{animation:none;display:none}}
  .hs.hidden{display:none}

  /* figure rig, characters are alive: idle bob + blink + arm sway; richer states via data-state */
  .fig .body,.fig .eyes,.fig .head,.fig .arm-l,.fig .arm-r,.fig .leg-l,.fig .leg-r{transform-box:fill-box}
  .fig .body{transform-origin:50% 100%;animation:figBob 3.4s ease-in-out infinite}
  .fig .eyes{transform-origin:50% 50%;animation:figBlink 4.6s linear infinite}
  .fig .head{transform-origin:50% 88%}
  .fig .arm-l,.fig .arm-r{transform-origin:50% 6%}
  .fig .leg-l,.fig .leg-r{transform-origin:50% 4%}
  .fig .arm-l{animation:figSwayL 3.4s ease-in-out infinite}
  .fig .arm-r{animation:figSwayR 3.4s ease-in-out infinite}
  .fig[data-state="talk"] .head{animation:figNod 1.2s ease-in-out infinite}
  .fig[data-state="talk"] .arm-r{animation:figGesture 1.2s ease-in-out infinite}
  .fig[data-state="walk"] .leg-l{animation:figStepL .5s ease-in-out infinite}
  .fig[data-state="walk"] .leg-r{animation:figStepR .5s ease-in-out infinite}
  .fig[data-state="walk"] .arm-l{animation:figStepR .5s ease-in-out infinite}
  .fig[data-state="walk"] .arm-r{animation:figStepL .5s ease-in-out infinite}
  .fig[data-state="walk"] .body{animation:figJog .25s ease-in-out infinite}
  .fig[data-state="wave"] .arm-r{animation:figWave .7s ease-in-out infinite}
  .fig[data-state="celebrate"] .arm-l{animation:figCheerL .5s ease-in-out infinite}
  .fig[data-state="celebrate"] .arm-r{animation:figCheerR .5s ease-in-out infinite}
  .fig[data-state="celebrate"] .body{animation:figHop .5s ease-in-out infinite}
  @keyframes figBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  @keyframes figBlink{0%,93.9%,98.1%,100%{transform:scaleY(1)}94.6%,97.4%{transform:scaleY(.1)}}
  @keyframes figSwayL{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
  @keyframes figSwayR{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes figNod{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes figGesture{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
  @keyframes figStepL{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
  @keyframes figStepR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
  @keyframes figJog{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
  @keyframes figWave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-178deg)}}
  @keyframes figCheerL{0%,100%{transform:rotate(160deg)}50%{transform:rotate(178deg)}}
  @keyframes figCheerR{0%,100%{transform:rotate(-160deg)}50%{transform:rotate(-178deg)}}
  .thought{animation:thoughtFloat 3.2s ease-in-out infinite;transition:opacity .25s}
  @keyframes thoughtFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .fig[data-state="walk"]+.thought{opacity:0}
  @media(prefers-reduced-motion:reduce){.thought{animation:none}}

  @media(prefers-reduced-motion:reduce){.fig .body,.fig .eyes,.fig .head,.fig .arm-l,.fig .arm-r,.fig .leg-l,.fig .leg-r{animation:none!important}}


  /* map effects */
  .room-g{cursor:pointer}
  .room-g.locked{cursor:not-allowed;opacity:.55}
  .room-g .glowrect{opacity:0;transition:opacity .3s}
  .room-g:not(.locked):hover .glowrect{opacity:1}
  /* the room to walk into next flashes its outline — unmissable among the dim ones */
  .room-g.next .glowrect{animation:roomflash 1.2s ease-in-out infinite}
  @keyframes roomflash{0%,100%{opacity:.15;stroke-width:2}50%{opacity:1;stroke-width:6}}
  @media(prefers-reduced-motion:reduce){.room-g.next .glowrect{animation:none;opacity:1;stroke-width:4}}
  .doorglow{animation:doorglow 1.8s ease-in-out infinite}
  @keyframes doorglow{0%,100%{opacity:.25}50%{opacity:.85}}
  .lamp-red{animation:alarmpulse 1.1s ease-in-out infinite}
  @keyframes alarmpulse{0%,100%{opacity:.25}50%{opacity:.95}}
  .rain line{stroke:#7fa0c0;stroke-width:1.2;opacity:.5}
  .rain{animation:rainfall .7s linear infinite}
  @keyframes rainfall{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
  @media(prefers-reduced-motion:reduce){.rain,.doorglow,.lamp-red{animation:none}}
  .ticker-tape{animation:tick 14s linear infinite}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-600px)}}
  .drawline{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){.drawline{animation:none;stroke-dashoffset:0}.ticker-tape{animation:none}}
  .wf-bar{transition:height .8s ease, y .8s ease, opacity .5s}

  .room-g:focus{outline:none}
  .room-g:focus-visible .glowrect{opacity:1}
  /* ---------------- modal ---------------- */
  #modal-root{position:fixed;inset:0;z-index:60;display:none}
  #modal-root.open{display:block}
  .mback{position:absolute;inset:0;background:#05080cd0;backdrop-filter:blur(3px)}
  .mwrap{position:absolute;inset:0;overflow-y:auto;display:grid;place-items:start center;padding:6vh 16px 60px;pointer-events:none}
  .mcard{pointer-events:auto;width:min(640px,100%);background:linear-gradient(#1a2230,#161e29);
    border:1px solid #d9a64840;border-radius:14px;padding:22px 24px;animation:mup .3s ease}
  @keyframes mup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .mcard .qk{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
  .mcard h4{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:10px}
  .mcard .q{font-size:15.5px;margin-bottom:14px}
  .mcard p{color:#c9d3df;font-size:14px}
  .mcard p+p{margin-top:8px}
  .mcard .num{font-family:var(--mono);color:var(--gold)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
    padding:10px 13px;font-size:13.5px;color:#cdd6e2;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
  .opt .key{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-top:1px;flex:none}
  .opt:not(:disabled):hover{border-color:#d9a64866;background:#202b3a}
  .opt.right{border-color:#63b38088;background:var(--green-dim);color:var(--text)}
  .opt.right .key{border-color:#63b38088;color:var(--green)}
  .opt.wrong{border-color:#e06a5e77;background:var(--red-dim);animation:shake .3s}
  .opt:disabled{cursor:default;opacity:.5}
  .opt.right:disabled,.opt.wrong:disabled{opacity:1}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .verdict{margin-top:12px;font-size:13.5px;line-height:1.55;border-radius:8px;padding:10px 13px}
  .verdict.good{background:var(--green-dim);border:1px solid #63b38044;color:#cfe6d6}
  .verdict.bad{background:var(--red-dim);border:1px solid #e06a5e3d;color:#eccfc9}
  .cite{display:inline-block;font-family:var(--mono);font-size:10.5px;border:1px solid #d9a64855;color:var(--gold);border-radius:4px;padding:1px 7px;margin:6px 6px 0 0;cursor:help}
  .cite:hover{background:var(--gold-dim)}
  .cite-pop{position:fixed;z-index:200;max-width:320px;background:var(--gold);color:#131a24;border-radius:8px;
    padding:9px 13px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 24px #00000066;animation:mup .2s ease}
  [data-theme="light"] .cite-pop{color:#ffffff}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}
  .file-list{list-style:none;margin:10px 0 4px;display:flex;flex-direction:column;gap:6px}
  .file-list li{font-size:13.5px;color:#c3cddb;padding-left:16px;position:relative}
  .file-list li::before{content:"·";position:absolute;left:2px;color:var(--gold)}
  .mclose{position:absolute;top:10px;right:14px;color:var(--faint);font-size:20px;padding:4px 8px}
  .mclose:hover{color:var(--text)}
  .mcard-holder{position:relative;pointer-events:auto;width:min(640px,100%)}

  /* end overlay content */
  .grade{font-family:var(--serif);font-size:32px;margin:6px 0 8px}
  .rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

  .mcard:focus{outline:none}
  .mcard:focus-visible{outline:2px solid var(--gold, #d9a648);outline-offset:2px}
  /* ---------------- the route ---------------- */
  /* the load sways as it is carried; the amount on it stays upright, because it
     is the one thing on screen that must be readable at every moment */
  .token .tok-sway{transform-box:fill-box;transform-origin:50% 0;animation:tokSway 2.6s ease-in-out infinite}
  #cargo.walking .tok-sway{animation-duration:.55s}
  @keyframes tokSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  /* the carrier himself breathes while idle and bounces with each step */
  .token .tok-bob{animation:tokBob 2.6s ease-in-out infinite}
  #cargo.walking .tok-bob{animation:tokStep .32s ease-in-out infinite}
  @keyframes tokBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes tokStep{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .tok-spent .tok-sway{animation:none;opacity:.75}
  @media(prefers-reduced-motion:reduce){.token .tok-sway,.token .tok-bob{animation:none}}

  /* ---------------- the cast of this game ---------------- */
  /* chip colours for the case's own speaker slots (shared css styles act/aud/uw/ph/you) */
  .pv.chief{background:#33290f;color:var(--gold);border:1px solid #d9a64844}
  .pv.cfo{background:#3a1f1c;color:#e8907f;border:1px solid #e06a5e44}
  .pv.bro{background:#232e3d;color:#aeb9c9;border:1px solid #8b98aa44}
  .pv.re{background:#173340;color:var(--cyan);border:1px solid #72b7cc44}
  .pv.cuo{background:#2c222c;color:#e8907f;border:1px solid #e06a5e44}
  /* ---------------- the act recap card ---------------- */
  /* a scoreboard, then the act as numbered beats: it should read like the end
     of a level, not like a page of notes */
  .recap .score{display:flex;gap:9px;margin:14px 0 2px}
  .recap .sc{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 8px;text-align:center}
  .recap .sc b{display:block;font-family:var(--mono);font-size:19px;font-weight:700}
  .recap .sc span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:1.3px;color:var(--faint);margin-top:6px}
  .recap .sc.loss b{color:var(--red)}
  .recap .sc.back b{color:var(--gold)}
  .recap .sc.left b{color:var(--text)}
  .recap ol.beats{list-style:none;margin:18px 0 0;counter-reset:beat}
  .recap ol.beats li{counter-increment:beat;position:relative;padding:0 0 13px 36px;font-size:13.5px;line-height:1.6;color:#c9d3df}
  .recap ol.beats li:last-child{padding-bottom:0}
  .recap ol.beats li::before{content:counter(beat);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:50%;
    background:var(--gold-dim);border:1px solid #d9a64866;color:var(--gold);
    font-family:var(--mono);font-size:11px;display:grid;place-items:center}
  .recap ol.beats li b{color:var(--text)}
  .recap .rule{margin-top:16px;background:var(--green-dim);border:1px solid #63b38044;border-radius:9px;
    padding:12px 14px;font-size:13.5px;line-height:1.6;color:#cfe6d6}
  .recap .rule b{color:var(--green)}

<script>
const BUILD="2026-09-03 09:03Z";
'use strict';
/* ================= what this game is =================
   THE CESSION. Two companies, two ways a loss starts, one standard.

   YOU are a consulting actuary, the outside specialist the Zurich houses
   call when reinsurance has to make it into the accounts. Odermatt, the
   broker on both accounts, carries your name from one house to the other.

   ACT ONE · LIMMAT ASSURANCE. The tariff slipped, and cohort PA-2026 is
   onerous the day it signs. Limmat brings you in to book the loss, then
   sit at the cession desk playing the quota share up and down until the
   board can live with the day-one number and the cost of cover.

   ACT TWO · CLEARBOOK ASSURANCE. A book that was priced right gets hit by a
   claims shock two years in. You argued for the treaty at renewal, back
   when the CFO called it a waste of margin, and now have to prove the
   recovery, post both entries, and run it off to zero.

   The cast:
     D. Meier    chief underwriting officer at Limmat. Owns the slipped tariff.
     V. Torres   chief actuary at Clearbook Assurance. Teaches by asking.
     M. Brandt   CFO at Clearbook Assurance. Asks the dangerous questions.
     K. Odermatt broker. Works both accounts, brings the term sheets.
     A. Keller   underwriter at Turicum Re, on the other side of both deals.
     the auditor arrives when the entries do. */
const GAME={
  key:'cession-v2',
  themeKey:'vfa-theme',   /* one theme choice across the whole series */
  tipKey:'tc-mobiletip',
  /* mastery economy: 30 station questions x 3 + 1 capstone case x 10 = 100 */
  questionPts:3, capstonePts:16,
  where:'Two books, two companies, one standard: getting reinsurance to count',
  wherePrefix:'The Cession · ',
  /* which house a meeting belongs to, for the phone nameplate */
  roomHouse:id=>ACT_A.includes(id)?'Limmat Assurance':'Clearbook Assurance',
  backLabel:'← The case files',
  restartCopy:'Both cases reset: every meeting, the books and the audit file. Your theme choice stays.',
  /* the books open the moment the first loss is on a file */
  ledgerOpen:()=>!(L.alc===0&&L.alorc===0&&L.csm===0&&L.lc===0&&L.lorc===0&&!S.done.slip),
  booksCallout:'<b>Your books just opened.</b>You can view the movement of your balances here. Click any one to open its full history.',
  masteryCallout:'<b>That answer just went in your file.</b>The bar collects points as you answer the quiz questions. Get them all right and you finish on 100. Click it any time to see the ones you missed and try them again.',
  drill:{
    retakeIntro:'Every missed question answered right. Before the points come back, one pass through the numbers of both cases: eight quick questions. Wrong answers cost nothing here. You only have to finish.',
    libLine:'eight quick questions on the numbers of both cases. Practice only, nothing at stake.',
    pendingLine:'Retake cleared. Finish the numbers drill, eight quick questions with nothing at stake, and the points come back.',
    doneCopy:'All eight numbers walked through, from the day-one net of −6’000 to the lifetime sum of exactly zero.'},
  capstoneTitle:'Year five: the stop-loss on the renewal desk',
  capstoneBlurb:'one treaty the mirror was not built for, worth 16 mastery. The cases close after this call.',
  capstoneIntro:'Ten meetings used proportional treaties, where one recovery ratio scales every loss exactly. This final case asks whether you know where that stops working. Odermatt is back with a cheap stop-loss. Get the call right first time for <strong>16 mastery points</strong>. Get it wrong and a finding is recorded, with another attempt later. Take your time with the memo.',
};
/* the cast: which figure kind animates for each dialogue slot, and its chip */
const SPEAKERS={chief:'actuary',aud:'auditor',bro:'ana',re:'ana',cfo:'staff2',cuo:'staff2',you:'staff'};
const SPEAKER_TAGS={chief:'CHIEF',aud:'AUD',bro:'BRKR',re:'TRE',cfo:'CFO',cuo:'CUO',you:'YOU',sys:'·'};
/* ================= modal system ================= */
const mroot=document.getElementById('modal-root'), mwrap=document.getElementById('mwrap');
let MODAL_LASTFOCUS=null;
/* whoever opened the modal can leave a callback here; closeModal fires it exactly
   once, no matter which path closed the card (button, ×, backdrop, Escape) */
let MODAL_ONCLOSE=null;
function openModal(node,closable,onClose){
  if(MODAL_ONCLOSE){const cb=MODAL_ONCLOSE;MODAL_ONCLOSE=null;cb();}
  MODAL_ONCLOSE=onClose||null;
  mwrap.innerHTML='';
  if(document.activeElement&&document.activeElement!==document.body)MODAL_LASTFOCUS=document.activeElement;
  const holder=document.createElement('div');holder.className='mcard-holder';
  holder.append(node);
  if(closable){
    const x=document.createElement('button');x.className='mclose';x.innerHTML='×';x.setAttribute('aria-label','Close');
    x.onclick=closeModal;holder.append(x);
    mroot.querySelector('.mback').onclick=closeModal;
  } else mroot.querySelector('.mback').onclick=null;
  mwrap.append(holder);mroot.classList.add('open');
  /* focus lands on the card so keyboard and screen-reader users follow the dialog */
  node.setAttribute('tabindex','-1');
  node.setAttribute('role','dialog');
  node.setAttribute('aria-modal','true');
  try{node.focus({preventScroll:true});}catch(e){}
  mroot.onkeydown=closable?e=>{if(e.key==='Escape')closeModal();}:null;
}
function closeModal(){
  mroot.classList.remove('open');mwrap.innerHTML='';mroot.onkeydown=null;
  if(MODAL_LASTFOCUS&&MODAL_LASTFOCUS.isConnected){try{MODAL_LASTFOCUS.focus({preventScroll:true});}catch(e){}}
  MODAL_LASTFOCUS=null;
  if(MODAL_ONCLOSE){const cb=MODAL_ONCLOSE;MODAL_ONCLOSE=null;cb();}
}
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

/* ---------- citation chips: references into IFRS 17 ---------- */
function citeLabel(c){ return c.startsWith('Appendix')?'IFRS 17 '+c:'IFRS 17.'+c; }
function citeTitle(c){
  if(c.startsWith('Appendix A'))return 'IFRS 17, Appendix A: the defined terms of the standard.';
  if(c.startsWith('Appendix'))return 'IFRS 17, '+c+'.';
  if(c.includes('/')){const[p,b]=c.split('/');
    return 'IFRS 17: paragraph '+p+' of the standard, with its application guidance in paragraph '+b+' of Appendix B.';}
  if(c[0]==='B')return 'IFRS 17, paragraph '+c+' in Appendix B, the application guidance. Letters in brackets are subparagraphs.';
  return 'IFRS 17, paragraph '+c+' of the standard. Letters in brackets are subparagraphs.';
}
function citeChip(c){return `<span class="cite" role="button" tabindex="0" data-ref="${c}" title="${citeTitle(c)}">${citeLabel(c)}</span>`;}
/* clicking a chip pops a small written-out explanation of the reference */
function showCitePop(t){
  document.querySelectorAll('.cite-pop').forEach(p=>p.remove());
  if(!t||!t.dataset.ref)return;
  const pop=el('div','cite-pop',citeTitle(t.dataset.ref));
  document.body.append(pop);
  const r=t.getBoundingClientRect();
  pop.style.left=Math.max(10,Math.min(window.innerWidth-pop.offsetWidth-10,r.left))+'px';
  pop.style.top=Math.min(window.innerHeight-pop.offsetHeight-10,r.bottom+8)+'px';
  setTimeout(()=>pop.remove(),7000);
}
document.addEventListener('click',e=>{const t=e.target.closest('.cite');
  if(!t){document.querySelectorAll('.cite-pop').forEach(p=>p.remove());return;} showCitePop(t);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.cite')){e.preventDefault();showCitePop(e.target.closest('.cite'));}});

'use strict';
/* ================= progress: saved state, mastery economy =================
   Every game on the kit shares one economy: a question answered right on the
   FIRST try banks its points, a miss banks nothing and files a finding whose
   points come back through the retake. Mastery is earned, never taken away.

   The host game supplies GAME (js/config.js), loaded before this chunk:
     GAME.key          localStorage key for the save
     GAME.questionPts  points a station/room question banks
     GAME.capstonePts  points a capstone case banks
     GAME.where        the idle "where am I" label
     GAME.masteryCallout  one-time explainer for the mastery bar
*/
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* localStorage throws outright on opaque origins (a file:// or data: preview),
   not just when full. Every read and write goes through these two. */
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
/* Swiss thousands separator: 1’120, matching the audience's convention */
const fmt = v => {const r=Math.round(v*10)/10;return r.toFixed(r%1===0?0:1).replace(/\B(?=(\d{3})+(?!\d))/g,"’");};
/* two decimals, for the recovery lines that must sum to exactly zero */
const fmt2 = v => {const r=Math.round(v*100)/100;return (Object.is(r,-0)?0:r).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))(?=.*\.)/g,"’");};
const QUESTION_PTS=GAME.questionPts, CAPSTONE_PTS=GAME.capstonePts;

let S={done:{},score:0,started:false};
try{const j=JSON.parse(lsGet(GAME.key)); if(j&&j.done)S=j;}catch(e){}
S.progress=S.progress||{};
S.mistakes=S.mistakes||[];
const save=()=>lsSet(GAME.key,JSON.stringify(S));
function prog(id){ if(!S.progress)S.progress={}; return S.progress[id]||(S.progress[id]={}); }
function freshState(){return {done:{},score:0,started:true,progress:{},mistakes:[]};}

function setAudit(){
  document.getElementById('auditVal').textContent=S.score;
  document.getElementById('auditBar').style.width=Math.max(0,S.score)+'%';
}
function award(pts){ S.score=Math.min(100,S.score+(pts||QUESTION_PTS)); setAudit(); save(); showMasteryCallout(); }
function penalty(active){ if(!active)return; save(); showMasteryCallout(); }

/* one-time callout after the very first scored answer: what the mastery bar is
   and how its points are collected (mirrors the books callout on the ledger) */
let MASTERY_CO_PENDING=false;
function showMasteryCallout(){
  if(S.seenMastery||MASTERY_CO_PENDING)return;
  MASTERY_CO_PENDING=true;
  const attempt=()=>{
    /* wait for the quiz card to close, so the callout is not buried under it */
    if(mroot.classList.contains('open')){setTimeout(attempt,700);return;}
    MASTERY_CO_PENDING=false;
    if(S.seenMastery)return;
    S.seenMastery=1;save();
    callout(document.getElementById('audit'),GAME.masteryCallout,18000);
  };
  setTimeout(attempt,700);
}
/* the gold speech bubble that hangs off a HUD element and points at it.
   Only one is ever on screen: a second arriving while one is open waits its
   turn, so two tips can never cover each other or the interface. */
let CO_QUEUE=[], CO_CURRENT=null;
function callout(target,html,ms){
  CO_QUEUE.push({target,html,ms});
  drainCallouts();
}
function drainCallouts(){
  if(CO_CURRENT&&CO_CURRENT.isConnected)return;
  CO_CURRENT=null;
  const next=CO_QUEUE.shift();
  if(next)CO_CURRENT=renderCallout(next.target,next.html,next.ms);
}
function renderCallout(target,html,ms){
  const hud=document.getElementById('hud');
  if(!target||!hud){drainCallouts();return null;}
  const c=el('div','books-callout','<button class="bc-x" aria-label="Dismiss">×</button>'+html);
  hud.append(c);
  const center=target.offsetLeft+target.offsetWidth/2;
  c.style.right=Math.max(8,hud.clientWidth-center-52)+'px';
  const kill=()=>{c.remove();drainCallouts();};
  /* ms 0 = sticky: it stays until the × is clicked, for popups that state a goal */
  if(ms===0){c.onclick=e=>{if(e.target.closest('.bc-x'))kill();};}
  else{c.onclick=kill;setTimeout(kill,ms||14000);}
  return c;
}
function setWhere(t){document.getElementById('whereLabel').textContent=t;}
/* ================= the numbers, in one place =================
   Every figure the game books comes from this module's standard worked
   example, restated in whole francs. Nothing here is invented for the game;
   the comments say where each one comes from and how it checks.

   Cohort Motor-2026, three fleet accounts written together, everything in francs.
   Treaty QS50 (Turicum Re) cedes 50% of fleets M1 and M2; Turicum Re excluded
   M3 at placement, so it has no cover.
*/
const N={
  claims:{M1:40000,M2:20000,M3:40000},
  get covered(){return N.claims.M1+N.claims.M2;},           /*  60,000 */
  get groupClaims(){return N.covered+N.claims.M3;},         /* 100,000 */
  cession:0.5,
  get ceded(){return N.covered*N.cession;},                 /*  30,000 */
  /* LOSS_ALLOCATION_SHARE: claims of the group covered by the treaty, over the
     claims of the whole group, uncovered contracts included (B119E) */
  get allocation(){return N.covered/N.groupClaims;},        /* 0.6 */
  /* RECOVERY_RATIO: expected claim recoveries over the covered claims (B119D) */
  get ratio(){return N.ceded/N.covered;},                   /* 0.5 */
  /* recovery_share = allocation x ratio, carried by every contract of the group */
  get share(){return N.allocation*N.ratio;},                /* 0.3 */

  /* the underlying group's CSM, in francs: the module's worked example
     (CSM 100, deteriorations 80 and 10, ceded CSM 20) scaled x1000 so the
     game speaks whole francs; 10% interest, half the remaining balance
     released each year as service is given */
  csm0:100000, rate:0.10, release:0.5,
  det2027:80000, /* the 2027 deterioration that exhausts the CSM */
  det2028:10000, /* a further deterioration while the group is already onerous */

  cededCsm0:20000, /* the treaty's own CSM; the loss recoveries never move it */

  /* the practice-case allocation fixture:
     treaty D covers A (6,000 of 30,000) and C (7,000 of 10,000); B (90,000) is
     uncovered. 40,000/130,000 x 13,000/40,000 = 0.1 */
  fixture:{A:30000,B:90000,C:10000,cA:6000,cC:7000,
           get covered(){return N.fixture.A+N.fixture.C;},          /*  40,000 */
           get group(){return N.fixture.A+N.fixture.B+N.fixture.C;},/* 130,000 */
           get ceded(){return N.fixture.cA+N.fixture.cC;},          /*  13,000 */
           get allocation(){return N.fixture.covered/N.fixture.group;},
           get ratio(){return N.fixture.ceded/N.fixture.covered;},
           get share(){return N.fixture.allocation*N.fixture.ratio;}}, /* 0.1 */

  /* the stop-loss Odermatt brings back in year five: attachment 1,000, two
     probability-weighted scenarios. The average ratio and the marginal ratio
     are not the same number, which is exactly why the mirror breaks. */
  stopLoss:{attach:1000,w:[0.6,0.4],base:[700,1200],deteriorated:[800,1400]},
};
/* half-up to the whole franc, the same convention the worked example uses at
   cent level. Verified by hand: with these inputs every roll comes out on a whole
   franc and the lifetime sum of the recovery lines still closes at exactly
   zero (5'850 + 585 + 3'000 − 4'718 + 472 − 5'189 = 0). */
const r2=x=>{const s=Math.sign(x);return s*Math.round(Math.abs(x)+1e-9);};

/* ---- the loss component of the underlying group, and its mirror ----
   The LC is the driver: the loss-recovery component is every LC roll scaled by
   the share, so the B119F cap holds by construction.
   Each entry: {yr, roll, line, lc, lorc, event}
     line   the disclosure line the mirrored amount is presented on
     event  true for a loss event, false for a run-off roll. Kept because the
            two read differently on the disclosure lines; neither moves the
            ceded CSM. Motor-2026 was profitable when it was written, so no
            part of this loss was ever deferred in the treaty's CSM, and
            paragraph 66(c) keeps the mirrored change out of it. */
const ROLLS=(()=>{
  const out=[]; let lc=0;
  const push=(yr,roll,line,leg,event)=>{lc=r2(lc+leg);out.push({yr,roll,line,lc:leg,lorc:r2(leg*N.share),bal:lc,event});};
  /* 2027: interest then release then the deterioration; the CSM is exhausted and
     the excess becomes the loss component (paragraph 47-48) */
  const csmAt2027=r2(r2(r2(N.csm0*(1+N.rate))*(1-N.release))*(1+N.rate));  /* 60’500 */
  const flip=r2(N.det2027-csmAt2027);                                       /* 19’500 */
  push(2027,'CSM to LC transfer','recovery',flip,true);
  push(2028,'Interest accretion','interest',r2(lcBal(out)*N.rate),false);
  push(2028,'Future service gap','change',N.det2028,true);
  push(2028,'Current service','reversal',-r2(lcBal(out)*N.release),false);
  push(2029,'Interest accretion','interest',r2(lcBal(out)*N.rate),false);
  push(2029,'Current service','reversal',-lcBal(out),false);
  function lcBal(o){return o.length?o[o.length-1].bal:0;}
  return out;
})();
const CSM_2027=r2(r2(r2(N.csm0*(1+N.rate))*(1-N.release))*(1+N.rate)); /* 60’500 */
const FLIP_LC=ROLLS[0].lc;      /* 19’500 */
const RECOVERY=ROLLS[0].lorc;   /* 5’850 */
/* One deterioration, two destinations. The 2027 review is 80'000 worse. The
   group's own CSM absorbs 60'500 of it and the excess 19'500 becomes the loss
   component. Mirrored at the 0.30 share the whole eligible change is 24'000:
     60'500 x 0.30 = 18'150  adjusts the treaty CSM (paragraph 66(c))
     19'500 x 0.30 =  5'850  is income now, and the LoRC (paragraph 66A-66B)
   The 5'850 is excluded from the treaty CSM because the underlying amount it
   mirrors never adjusted the underlying CSM. The 18'150 is not excluded: the
   underlying CSM did absorb its half. A group onerous at initial recognition
   works the other way round - there the adjustment IS the recovery, added to
   the CSM, which is Limmat's case. */
const CEDED_CSM_ADJ=r2(CSM_2027*N.share);                 /* 18’150 */
const CEDED_CSM_END=r2(N.cededCsm0+CEDED_CSM_ADJ);        /* 38’150 */

/* ---- Act One: Limmat Assurance, cohort PA-2026, onerous at inception ----
   Premiums of 100’000 francs against fulfilment cash flows of 112’000: the tariff slipped,
   and the tranche is onerous the day it signs (paragraph 47). Two coverage
   years, half the service in each, measured without interest to keep the act
   short; the case card says so. Turicum Re quotes any cession at expected
   claims plus a margin of 6 per hundred of cover: the slip is the cedent's
   either way, the margin is the price of certainty. */
const NA={
  prem:100000, fcf:112000,
  get lc(){return r2(NA.fcf-NA.prem);},                 /* 12’000 */
  steps:[0,0.25,0.5,0.75], signed:0.5, marginPer:6000,
  quote(x){return {lorc:r2(NA.lc*x), rec:r2(NA.fcf*x), prem:r2((NA.fcf+NA.marginPer)*x),
                   cost:r2(NA.marginPer*x), net:r2(-NA.lc+NA.lc*x)};},
};
const A_LORC=r2(NA.lc*NA.signed);         /* 6’000 of recovery income at signing */
const A_COST=r2(NA.marginPer*NA.signed);  /* 3’000 net cost of the cover */

/* Limmat is the other mechanic: onerous at initial recognition, so paragraph
   66A adds the loss recovery to the treaty's own CSM. The net cost grows; it
   is not reduced. IE138K does the same, CU45 to CU72 on a CU27 recovery. */
const A_CSM0=A_COST;                      /* 3’000 net cost on the cover held */
const A_CSM_END=r2(A_CSM0+A_LORC);        /* 9’000 after the 66A adjustment */

/* ================= ledger: the chips in the top bar =================
   The books only move when the player books correctly. `L` holds the live
   balances; the game rebuilds it from saved state (ledgerFromState) and
   applies deltas as the player books.

   The host game supplies:
     LEDGER_CHIPS  [{k:'csm', label:'CSM', cls:'hot', hideZero:true}, ...]
                   `k` is the key into L and the id suffix of the chip
     GAME.ledgerOpen()  true once the books have opened (chips render)
     GAME.booksCallout  one-time explainer shown when the books first open
     COMP_NAMES / ledgerHistory()  used by the roll-forward (rollforward.js)
*/
let L={};
function renderChips(){
  const c=document.getElementById('ledgerchips');
  if(!c)return;
  if(!GAME.ledgerOpen()){c.innerHTML='';return;}
  c.innerHTML=LEDGER_CHIPS.filter(d=>!(d.hideZero&&!L[d.k]))
    .map(d=>{
      const cls=typeof d.cls==='function'?d.cls(L[d.k]):(d.cls||'');
      const v=(d.dp===2?fmt2:fmt)(L[d.k]);
      return `<div class="chip ${cls}" id="chip-${d.k}" role="button" tabindex="0" title="Click for the movements" aria-label="${d.label} ${v}, open the movements"><span>${d.label}</span><b>${v}</b></div>`;
    }).join('');
  c.querySelectorAll('.chip').forEach(elc=>{
    const k=elc.id.replace('chip-','');
    const open=()=>showComponent(k);
    elc.onclick=open;
    elc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
}
function showBooksCallout(){
  if(S.seenBooks)return false;
  const chips=document.getElementById('ledgerchips');
  if(!chips||!chips.children.length)return false;
  S.seenBooks=1;save();
  callout(chips,GAME.booksCallout,14000);
  return true;
}
/* every later booking confirms itself: a short popup naming the accounts that moved */
function booksToast(d){

  if(!chips||!chips.children.length)return;
  const parts=LEDGER_CHIPS.filter(c=>d[c.k]).map(c=>{
    const v=d[c.k];
    return c.label+' '+(v>0?'+':'−')+(c.dp===2?fmt2:fmt)(Math.abs(v));
  });
  if(!parts.length)return;
  document.querySelectorAll('.books-callout').forEach(c=>c.remove());
  callout(chips,'<b>Your accounts just updated.</b>'+parts.join(' · '),5000);
}
function applyDeltas(d,force){
  if(!d)return;
  for(const k in d)L[k]=Math.round((L[k]+d[k])*100)/100;
  renderChips();
  if(!showBooksCallout())booksToast(d);
  for(const k in d){const e=document.getElementById('chip-'+k); if(e)e.classList.add('flash');}
}
/* ================= the books of both cases ================= */
const ROOM_ORDER=['slip','desk','shortyear','renewal','booking','workpaper','mirror','posting','runoff','audit'];
const ROOM_NAMES={slip:'The Pricing Slip',desk:'The Cession Desk',shortyear:'The Short Book',
  renewal:'The Renewal',booking:'The Booking Check',workpaper:'The Allocation',
  mirror:'The Mirror Run',posting:'The Two Entries',runoff:'The Run-Off',audit:'The Sign-Off'};
/* which act a meeting belongs to; the chip bar follows the case being worked */
const ACT_A=['slip','desk','shortyear'];

const CHIPS_A=[
  {k:'alc',  label:'Limmat LC',   cls:'neg'},
  {k:'alorc',label:'Limmat LoRC', cls:'hot'},
  {k:'apnl', label:'Recovery P&L', cls:v=>v<0?'neg':''},
];
const CHIPS_B=[
  {k:'csm',   label:'Clearbook CSM', cls:'hot'},
  {k:'lc',    label:'LC',        cls:'neg', hideZero:true},
  {k:'lorc',  label:'LoRC',      cls:'hot'},
  {k:'ccsm',  label:'Treaty CSM', hideZero:true},
  {k:'pnl',   label:'Recovery P&L', cls:v=>v<0?'neg':''},
];
let LEDGER_CHIPS=CHIPS_A;
function syncChips(){LEDGER_CHIPS=S.done.shortyear?CHIPS_B:CHIPS_A;}

const COMP_NAMES={
  alc:'Loss component of Limmat cohort PA-2026 (onerous at inception)',
  alorc:'Loss-recovery component on Limmat’s quota share (QS at 50%)',
  apnl:'Limmat’s recovery lines in P&L, booked to date',
  csm:'CSM of the Clearbook underlying group',
  lc:'Loss component of the Clearbook underlying group',
  lorc:'Loss-recovery component (asset for remaining coverage)',
  ccsm:'CSM of the treaty held (QS50, Turicum Re)',
  pnl:'The Clearbook recovery lines in P&L, booked to date'};
const COMP_NOTES={
  alc:'Loss-making from the first day, not after a CSM ran out: premiums of '+fmt(NA.prem)+' against fulfilment cash flows of '+fmt(NA.fcf)+' (paragraph 47). No CSM ever existed on this cohort.',
  alorc:'The underlying loss scaled by the recovery share. The treaty covers the whole cohort, so the allocation is 1.00 and the share <em>is</em> the cession.',
  apnl:'Recognized as <strong>recovery of losses on onerous underlying contracts</strong>, reversed through <strong>reversal of loss recoveries</strong> as the two coverage years run. Sums to exactly zero over the life.',
  lorc:'Every movement of the underlying loss component, scaled by the recovery share of 0.3. Because the mirror scales the loss component itself, this balance can never exceed the recoverable part of it (B119F).',
  ccsm:'The treaty\u2019s own CSM. The 2027 review moves it by <strong>'+fmt(CEDED_CSM_ADJ)+'</strong>: the part of the change that mirrors what the group\u2019s own CSM absorbed. The other '+fmt(RECOVERY)+' mirrors the loss component, is excluded by paragraph 66(c), and goes to P&L. Later deteriorations do not move it, because the group has no CSM left.',
  pnl:'Recovery income is timing, not profit. Over the life of the case these lines sum to <strong>exactly zero</strong>.'};

/* what the books look like once each meeting is closed (merged in room order) */
const CHECK={
  base:{alc:0,alorc:0,apnl:0,csm:0,lc:0,lorc:0,ccsm:0,pnl:0},
  slip:{alc:NA.lc},
  desk:{alc:NA.lc,alorc:A_LORC,apnl:A_LORC},
  shortyear:{alc:0,alorc:0,apnl:0},
  renewal:{csm:0,lc:FLIP_LC,lorc:0,ccsm:CEDED_CSM_END,pnl:0},
  posting:{csm:0,lc:FLIP_LC,lorc:RECOVERY,ccsm:CEDED_CSM_END,pnl:RECOVERY},
  runoff:{csm:0,lc:0,lorc:0,ccsm:CEDED_CSM_END,pnl:0},
};
/* Act One's short schedule: the loss at signing, then two clean closes */
const A_ROLLS=[
  {yr:2026,roll:'Recovery recognized',line:'recovery',alc:NA.lc,alorc:A_LORC},
  {yr:2026,roll:'Released · cover year 1',line:'reversal',alc:-r2(NA.lc/2),alorc:-r2(A_LORC/2)},
  {yr:2027,roll:'Released · cover year 2',line:'reversal',alc:-r2(NA.lc/2),alorc:-r2(A_LORC/2)},
];
/* the Clearbook renewal file is worked in three sittings */
const FILE_STEPS=[
  {csm:N.csm0,ccsm:N.cededCsm0},                       /* 1 · written and ceded */
  {csm:r2(N.csm0*(1+N.rate)*(1-N.release))},           /* 2 · 2026 interest then release */
  {csm:0,lc:FLIP_LC,ccsm:CEDED_CSM_END},               /* 3 · 2027 review: the CSM-absorbed part adjusts the treaty CSM (66(c)) */
];
/* the Clearbook run-off closes the six rolls in two year-ends; index into ROLLS */
const LAPS=[[0,1,2,3],[4,5]]; /* year-end one opens with the 2027 recognition already booked */

function ledgerFromState(){
  L={...CHECK.base};
  for(const k of ['slip','desk','shortyear','renewal','posting','runoff'])
    if(S.done[k]) L={...L,...CHECK[k]};
  const p=S.progress||{};
  /* Act One partials */
  if(!S.done.desk&&p.desk&&p.desk.signed&&S.done.slip){
    L.alorc=r2(L.alorc+A_LORC);L.apnl=r2(L.apnl+A_LORC);}
  if(!S.done.shortyear&&p.shortyear&&p.shortyear.closed&&S.done.desk){
    L.alc=0;L.alorc=0;L.apnl=0;}
  /* Act Two partials */
  if(!S.done.renewal&&p.renewal){const s=p.renewal.step||0;
    for(let i=0;i<s;i++)for(const k in FILE_STEPS[i])L[k]=FILE_STEPS[i][k];}
  if(!S.done.posting&&p.posting&&p.posting.stamped&&S.done.renewal){
    L.lorc=r2(L.lorc+RECOVERY);L.pnl=r2(L.pnl+RECOVERY);}
  if(!S.done.runoff&&p.runoff&&S.done.posting){
    const lap=p.runoff.lap||0;
    for(let i=1;i<=lap;i++)for(const j of LAPS[i-1].filter(x=>x>0)){const r=ROLLS[j];
      L.lc=r2(L.lc+r.lc);L.lorc=r2(L.lorc+r.lorc);L.pnl=r2(L.pnl+r.lorc);
}}
  for(const k in L)L[k]=r2(L[k]);
  syncChips();
}
ledgerFromState();

function ledgerHistory(){
  const H=[]; const p=S.progress||{};
  const add=(room,label,d)=>H.push({room,label,d});
  if(S.done.slip)add('Limmat','Cohort PA-2026 signs onerous: premiums '+fmt(NA.prem)+' against FCF '+fmt(NA.fcf),{alc:NA.lc});
  const signedA=S.done.desk||(p.desk&&p.desk.signed&&S.done.slip);
  if(signedA){add('Limmat','QS signed at '+(NA.signed*100)+'%: the loss mirrored at the cession',{alorc:A_LORC,apnl:A_LORC});}
  if(S.done.shortyear||(p.shortyear&&p.shortyear.closed&&S.done.desk)){
    add('Limmat · 2026','Reversal of loss recoveries · cover year 1',{alc:A_ROLLS[1].alc,alorc:A_ROLLS[1].alorc,apnl:A_ROLLS[1].alorc});
    add('Limmat · 2027','Reversal of loss recoveries · cover year 2',{alc:A_ROLLS[2].alc,alorc:A_ROLLS[2].alorc,apnl:A_ROLLS[2].alorc});}
  const fileStep=S.done.renewal?3:(p.renewal?(p.renewal.step||0):0);
  if(fileStep>=1){add('Clearbook Renewal','Cohort Motor-2026 recognized: CSM at inception',{csm:N.csm0});
                  add('Clearbook Renewal','Treaty QS50 placed with Turicum Re: its own CSM',{ccsm:N.cededCsm0});}
  if(fileStep>=2){add('Clearbook Renewal','2026 interest at 10% on the group CSM',{csm:r2(N.csm0*N.rate)});
                  add('Clearbook Renewal','2026 service given: half the balance released',{csm:-r2(N.csm0*(1+N.rate)*N.release)});}
  if(fileStep>=3){add('Clearbook Renewal','2027 interest at 10%',{csm:r2(FILE_STEPS[1].csm*N.rate)});
                  add('Clearbook Renewal','2027 reserve review, claims worse by '+N.det2027+': the CSM absorbs '+fmt(CSM_2027),{csm:-CSM_2027});
                  add('Clearbook Renewal','The CSM is exhausted: the excess is a loss component',{lc:FLIP_LC});
                  add('Clearbook Renewal','Paragraph 66(c): the covered part of what the CSM absorbed adjusts the treaty CSM',{ccsm:CEDED_CSM_ADJ});}
  const stamped=S.done.posting||(p.posting&&p.posting.stamped&&S.done.renewal);
  if(stamped){
    add('Clearbook Entries','Loss mirrored onto the treaty: '+fmt(FLIP_LC)+' × '+N.share,{lorc:RECOVERY,pnl:RECOVERY});
    add('Clearbook Entries','Second entry: the loss-recovery component of the reinsurance asset',{lorc:0});}
  const lap=S.done.runoff?2:((p.runoff&&S.done.posting)?(p.runoff.lap||0):0);
  for(let i=1;i<=lap;i++)for(const j of LAPS[i-1].filter(x=>x>0)){const r=ROLLS[j];
    const d={lc:r.lc,lorc:r.lorc,pnl:r.lorc};
    add('Clearbook Close · '+r.yr,r.line+' '+r.roll,d);}
  return H;
}

/* ================= the act recap =================
   Shown when an act closes. Not a teaching point: a look back at the whole
   act in plain sentences, with the numbers it produced, so what the player
   remembers is how the reinsurance actually reached the books. */
function actOneRecap(){
  return new Promise(res=>{

function showComponent(k){
  const H=ledgerHistory().filter(h=>h.d&&h.d[k]!==undefined);
  const dp=(LEDGER_CHIPS.find(d=>d.k===k)||{}).dp===2?fmt2:fmt;
  const card=el('div','mcard');
  card.append(el('div','qk','Movements'));
  card.append(el('h4','',(COMP_NAMES[k]||k)+' · now '+dp(L[k])));
  const note=(typeof COMP_NOTES!=='undefined'&&COMP_NOTES)?COMP_NOTES[k]:null;
  if(note)card.insertAdjacentHTML('beforeend','<p class="fy">'+note+'</p>');
  if(!H.length){card.insertAdjacentHTML('beforeend','<p>Nothing has been booked here yet. Play on and come back.</p>');}
  else{
    let bal=0;
    const steps=H.map(h=>{bal=Math.round((bal+h.d[k])*100)/100;return{label:h.label,room:h.room,delta:h.d[k],to:bal};});
    const n=steps.length, vals=[0].concat(steps.map(s=>s.to));
    const lo=Math.min(0,...vals), hi=Math.max(1,...vals);
    const Wd=520,Ht=150,pad=12;
    const y=v=>pad+(hi-v)/(hi-lo||1)*(Ht-2*pad);
    const slot=(Wd-20)/n, bw=Math.min(70,slot*0.7);
    let bars='';
    steps.forEach((s,i)=>{
      const x=10+i*slot+(slot-bw)/2;
      const a=y(s.to), b2=y(s.to-s.delta);
      const y1=Math.min(a,b2), hpx=Math.max(2,Math.abs(a-b2));
      bars+=`<rect x="${x}" y="${y1}" width="${bw}" height="${hpx}" rx="2" fill="${s.delta>=0?'#63b380':'#e06a5e'}" opacity=".85"/>`;
      bars+=`<text x="${x+bw/2}" y="${Ht+12}" text-anchor="middle" font-size="10" fill="#5d6b7e" font-family="var(--mono)">${i+1}</text>`;
      bars+=`<text x="${x+bw/2}" y="${y1-3}" text-anchor="middle" font-size="10" fill="#8b98aa" font-family="var(--mono)">${dp(s.to)}</text>`;
    });
    card.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 ${Wd} ${Ht+18}" style="width:100%;margin:6px 0"><line x1="6" x2="${Wd-6}" y1="${y(0)}" y2="${y(0)}" stroke="#2c394a"/>${bars}</svg>`);
    const rows=steps.map((s,i)=>`<tr><td class="tn">${i+1}</td><td>${s.label}<span class="troom"> · ${s.room}</span></td><td class="td ${s.delta<0?'neg':'pos'}">${s.delta>0?'+':''}${dp(s.delta)}</td><td class="tb">${dp(s.to)}</td></tr>`).join('');
    card.insertAdjacentHTML('beforeend',`<table class="roll"><tr><th></th><th>Movement</th><th>Change</th><th>Balance</th></tr>${rows}</table>`);
  }
  const f=el('div','mfoot');const b=el('button','cta','Close');b.onclick=closeModal;f.append(b);card.append(f);
  openModal(card,true);
}

function retakeList(){
  const byQ=new Map();
  for(const m of S.mistakes){
    if(!m.c||m.done)continue;
    if(!byQ.has(m.q))byQ.set(m.q,{q:m.q,k:m.k,w:m.w,c:m.c,y:m.y,x:m.x||'',p:m.p||0,wrongs:new Set()});
    if(m.a&&m.a!==m.c)byQ.get(m.q).wrongs.add(m.a);
  }
  return [...byQ.values()];
}

   earned back. At the end of a run the numbers drill is the mandatory last step.

async function runDrillCore(){
  /* returns the number answered right on the first try, or -1 if the drill was left early */
  let right=0;
  for(let i=0;i<NUMQ.length;i++){
    const r=await examQuiz(NUMQ[i],i+1,NUMQ.length,true);
    if(!r)return -1;
    if(r==='right')right++;
  }
  return right;
}
/* leaving the drill half-way, when it is the last step of a cleared retake, must
   not look like a failure: the retake answers are banked and the drill is free */

async function runDrill(){

/* Transfer, not recall: nothing in the scenes walked through these cases.
   Each is a scored quiz worth CAPSTONE_PTS; a miss files a finding like any other. */
function capstonesClosed(){
  /* resume-safe progress through the capstone file. Older saves have no counter:
     infer closed cases from the score, since room points can never exceed
     100 minus the capstone points (the economy always sums to 100). */
  if(S.capstoneN==null){
    const roomMax=100-CAPSTONES.length*CAPSTONE_PTS;
    S.capstoneN=Math.max(0,Math.min(CAPSTONES.length,Math.ceil((S.score-roomMax)/CAPSTONE_PTS)));
    save();
  }
  return S.capstoneN;
}
async function runCapstones(){
  if(capstonesClosed()===0)await new Promise(res=>{
    const card=el('div','mcard');

    b.onclick=()=>{closeModal();res();};f.append(b);card.append(f);

  });
  setWhere(GAME.wherePrefix+'The capstone file');
  while(S.capstoneN<CAPSTONES.length){
    const c=CAPSTONES[S.capstoneN];c.intro=c.ctx;
    await quiz(c,true);
    S.capstoneN++;save();
  }
  S.capstoneDone=1;save();
  setWhere(GAME.where);
  endOverlay();
}

   The runner lives in shared/js/retake-flow.js; this is only the case. Transfer,
   not recall: the seven meetings only ever walked a proportional treaty. */

  const blk=cl=>{const rec=cl.map(c=>Math.max(0,c-s.attach));
    return[rec.reduce((t,r,i)=>t+s.w[i]*r,0), cl.reduce((t,c,i)=>t+s.w[i]*c,0)];};
  const[er0,ec0]=blk(s.base), [er1,ec1]=blk(s.deteriorated);
  return{er0,ec0,er1,ec1,avg:er0/ec0,marg:(er1-er0)/(ec1-ec0)};})();

function quiz(o, scoring){
  /* resolves when correct + continue; a right answer on the FIRST try earns points
     (host hook `award(o.pts)`), a miss files a mistake and forfeits them */
  return new Promise(res=>{
    let missed=false;
    const card=el('div','mcard');
    card.append(el('div','qk',o.kicker||'Your call'));
    const pre=o.intro||o.ctx; /* the case memo stays on the question page, so the reader can re-check the facts */
    if(pre)card.insertAdjacentHTML('beforeend',pre);
    card.append(el('div','q',o.q));
    const opts=el('div','opts'); const keys='ABCD';
    const shuffled=o.options.map((op,i)=>({op,r:(Math.sin(i*9301+o.q.length*49297)*233280)%1}))
      .sort((a,b)=>a.r-b.r).map(x=>x.op);
    shuffled.forEach((op,i)=>{
      const b=el('button','opt');
      b.append(el('span','key',keys[i]),el('span','',op.t));
      b.onclick=()=>{
        if(op.ok){
          [...opts.children].forEach(x=>x.disabled=true);
          b.classList.add('right');
          if(scoring&&!missed&&typeof award==='function')award(o.pts);
          const v=el('div','verdict good','<strong>Correct.</strong> '+op.why
            +(o.cite?'<div>'+o.cite.map(citeChip).join('')+'</div>':''));
          card.append(v);
          const f=el('div','mfoot');const c=el('button','cta big',o.continueLabel||'Continue');
          c.onclick=()=>{closeModal();res();};f.append(c);card.append(f);
          c.scrollIntoView({block:'nearest'});
        }else{
          b.classList.add('wrong');b.disabled=true;
          /* the finding files where it happened: the scene name, without the
             house/line prefix the top bar carries in front of it */
          if(scoring){const co=o.options.find(x=>x.ok)||{};S.mistakes.push({w:document.getElementById('whereLabel').textContent.replace(GAME.wherePrefix,''),k:o.kicker||'',q:o.q,a:op.t,c:co.t||'',y:co.why||'',x:o.ctx||o.intro||'',p:o.pts||0});S.retakePassed=0;S.drillDue=0;}
          missed=true;
          penalty(scoring);
          card.append(el('div','verdict bad','<strong>The auditor flags it.</strong> '+op.why+(scoring?' <em>(No mastery earned on this one; the finding goes on file, and its points come back through the retake. Try again.)</em>':' <em>(Review replay, nothing at stake.)</em>')));
        }
      };
      opts.append(b);
    });
    card.append(opts);
    openModal(card,false);
  });
}

/* ================= dialogue ================= */
/* Six speaker slots, styled by .pv.<slot> in dialogue.css. Each game maps its
   own cast onto them: SPEAKERS ties a slot to the figure kind that animates
   while it talks, SPEAKER_TAGS is the two-or-three letter chip on the avatar. */
function talk(sceneEl,lines){
  const WHO=SPEAKERS;
  const speak=w=>{sceneEl.querySelectorAll('.fig').forEach(f=>{
    f.dataset.state=(WHO[w]&&f.dataset.who===WHO[w])?'talk':'idle';});};
  return new Promise(res=>{
    let i=0;
    const bar=el('div','dlg');
    sceneEl.append(bar);
    const show=()=>{
      const ln=lines[i];
      speak(ln.w);
      bar.innerHTML='';
      bar.append(el('div','pv '+ln.w, SPEAKER_TAGS[ln.w]||'·'));
      const t=el('div','txt');
      if(ln.n)t.append(el('div','who',ln.n));
      t.append(el('p','',ln.t));bar.append(t);
      const n=el('button','next',i<lines.length-1?'Next':'Done');
      n.onclick=()=>{i++;if(i<lines.length)show();else{bar.remove();sceneEl.querySelectorAll('.fig').forEach(f=>f.dataset.state='idle');res();}};
      bar.append(n);
      /* a click anywhere on the bar advances too — the conversation never traps anyone */
      bar.onclick=e=>{if(!e.target.closest('.next'))n.click();};
    };
    show();
  });
}

  sc.id='scene';
  wrap.append(sc);
  stage.append(wrap);
  const top=el('div','scene-top');
  const back=el('button','backbtn',GAME.backLabel);
  back.onclick=()=>{closeModal();renderMap();};
  /* on a phone the HUD breadcrumb is hidden and the scene's own title is off to
     the side of the swipeable viewport, so the room says its name here instead */
  const left=el('div','stl');
  left.append(back);
  if(ROOM_NAMES[roomId]){
    const n=ROOM_ORDER.indexOf(roomId);
    const house=GAME.roomHouse?GAME.roomHouse(roomId):'';
    const tag=el('div','roomtag');
    tag.innerHTML=(house?'<span class="rt-house">'+house+'</span>':'')
      +'<b>'+(n>=0?(n+1)+' · ':'')+ROOM_NAMES[roomId]+'</b>';
    left.append(tag);
  }
  top.append(left);
  const obj=el('div','objective',objectiveHTML||'');
  obj.id='objective';
  top.append(obj);
  return {sc,top,obj,mount(svg){
    sc.innerHTML='<div class="scenewrap">'+svg+'</div>';sc.append(top);
    /* the SVG has no measured width until after layout, so ask twice and once
       more late; scenePanner() replaces any panner it already made */
    const pan=()=>scenePanner(sc);
    requestAnimationFrame(()=>requestAnimationFrame(pan));
    setTimeout(pan,300);
  }};
}
/* On a phone the room is wider than the screen and the data screen sits off
   the right edge, where nothing announces it. This is the announcement: one
   button that says where it will take you and takes you there. */
function scenePanner(sc){
  const wrap=sc.querySelector('.scenewrap');
  if(!wrap)return;
  sc.querySelectorAll(':scope > .scenepan').forEach(n=>n.remove());
  if(wrap.scrollWidth<=wrap.clientWidth+8)return;   /* it all fits: no panner */
  const b=el('button','scenepan','');
  const far=()=>wrap.scrollWidth-wrap.clientWidth;
  const atData=()=>wrap.scrollLeft>far()/2;
  const sync=()=>{b.textContent=atData()?'\u2190 The room':'The data screen \u2192';
    b.setAttribute('aria-label',atData()?'Scroll back to the room':'Scroll to the data screen');};
  b.onclick=()=>{
    const to=atData()?0:far();
    if(!RM){try{wrap.scrollTo({left:to,behavior:'smooth'});}catch(e){}}
    /* some engines ignore a smooth scrollTo on this element, so land it either way */
    setTimeout(()=>{if(Math.abs(wrap.scrollLeft-to)>2)wrap.scrollLeft=to;sync();},RM?0:420);
  };
  wrap.addEventListener('scroll',sync,{passive:true});
  sync(); sc.append(b);
}
function setObjective(html){const o=document.getElementById('objective');if(o)o.innerHTML=html;}
let HS_BUSY=false;
function refreshNext(){
  const sc=document.getElementById('scene'); if(!sc)return;
  /* the accessible name carries the state, so a screen reader hears which
     steps are still open without relying on the decorative tick */
  sc.querySelectorAll('.hs').forEach(h=>{
    const n=h.dataset.cap||'';
    h.setAttribute('aria-label',n+(h.classList.contains('done')?', completed':', not completed'));
  });
  sc.querySelectorAll('.hs.next').forEach(h=>h.classList.remove('next'));
  const nxt=[...sc.querySelectorAll('.hs')].find(h=>!h.classList.contains('done')&&!h.classList.contains('hidden'));
  if(nxt){
    nxt.classList.add('next');
    /* when the scene is a swipeable viewport (small portrait screens), bring the next step into view */
    const sw=sc.querySelector('.scenewrap');
    if(sw&&sw.scrollWidth>sw.clientWidth+8){
      try{
        const r=nxt.getBoundingClientRect(), w=sw.getBoundingClientRect();
        sw.scrollTo({left:sw.scrollLeft+(r.left+r.width/2)-(w.left+w.width/2),behavior:'smooth'});
      }catch(e){}
    }
  }
}
function bindHotspots(sc,handlers){
  sc.querySelectorAll('.hs').forEach(g=>{
    const id=g.dataset.hs;
    const fire=()=>{
      if(!handlers[id]||HS_BUSY)return;
      HS_BUSY=true;
      /* a handler that throws used to leave the room silent: the step stayed
         open, nothing advanced, and nothing said why */
      const r=Promise.resolve(handlers[id](g)).catch(e=>{console.error('hotspot '+id+' failed:',e);});
      if(g.classList.contains('q'))r.then(()=>g.classList.add('done'));
      r.finally(()=>{HS_BUSY=false;refreshNext();});
    };
    g.addEventListener('click',fire);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire();}});
  });
  setTimeout(refreshNext,0);
}

/* ================= navigation between scenes =================
   A game is an ordered list of scenes unlocked one at a time. The host supplies
   ROOM_ORDER (ids in order), ROOM_NAMES (id -> label) and ROOM_FNS (id -> the
   function that renders that scene), plus GAME.wherePrefix and GAME.backLabel.
   The map/line drawing itself belongs to the game; this is the bookkeeping.
*/
function unlockedCount(){
  let n=1;
  for(const id of ROOM_ORDER){if(S.done[id])n=Math.max(n,ROOM_ORDER.indexOf(id)+2);}
  return Math.min(n,ROOM_ORDER.length);
}
function isLastDone(){return !!S.done[ROOM_ORDER[ROOM_ORDER.length-1]];}
function enterRoom(id){
  setWhere(GAME.wherePrefix+ROOM_NAMES[id]);
  ROOM_FNS[id]();
}
function completeRoom(id){
  if(S.progress&&S.progress[id])delete S.progress[id];
  if(!S.done[id]){S.done[id]=true;save();}
}
/* the way out of a finished scene. The primary action goes straight to the
   next meeting: routing every hand-off through the map made the player click
   twice to continue, once on a button that already named where it was going.
   The map stays available as the secondary action. */
function doorOut(sc,label){
  sc.querySelectorAll(':scope > .cta.big, :scope > .doorrow').forEach(n=>n.remove());
  const idx=ROOM_ORDER.indexOf(CURRENT_ROOM);
  const next=idx>=0?ROOM_ORDER[idx+1]:null;
  const row=el('div','doorrow');
  /* full width, not left:50%: a shrink-wrapped row anchored at the midpoint only
     has half the scene to lay out in, which wrapped the two buttons onto two lines
     and pushed the row up over the furniture */
  row.style.cssText='position:absolute;left:0;right:0;bottom:16px;z-index:5;padding:0 14px;'
    +'display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap';
  if(next&&S.done[CURRENT_ROOM]){
    const m=el('button','cta ghost',GAME.backLabel);
    m.onclick=()=>{closeModal();renderMap();};
    const b=el('button','cta big',label||('Next: '+ROOM_NAMES[next]+' →'));
    b.onclick=()=>{closeModal();enterRoom(next);};
    row.append(m,b);
  } else {
    const b=el('button','cta big',label||GAME.backLabel.replace('← ','Back to the ')+' →');
    b.onclick=()=>{closeModal();renderMap();};
    row.append(b);
  }
  sc.append(row);
}
/* ================= shell: HUD wiring, theme, restart, phone tip =================
   Everything in the top bar that is the same in every game on the kit. The host
   supplies GAME.themeKey / GAME.tipKey and the restart copy, and calls
   bootShell() after its own chunks have defined renderMap()/titleScreen().
*/
function restartGame(){
  S=freshState();
  save();ledgerFromState();renderChips();setAudit();
  if(typeof onRestart==='function')onRestart();
  closeModal();renderMap();
}
function bootShell(){
  /* the brand is the way back to the opening screen: without it, once you take
     the case the overview is unreachable except by restarting */
  const brand=document.querySelector('#hud .brand');
  if(brand){
    brand.setAttribute('role','button');
    brand.setAttribute('tabindex','0');
    brand.title='Back to the opening screen';
    const home=()=>{closeModal();titleScreen();};
    brand.onclick=home;
    brand.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();home();}};
  }
  document.getElementById('dirBtn').onclick=()=>showDirectory();
  document.getElementById('audit').onclick=()=>showAudit();
  document.getElementById('audit').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showAudit();}};
  document.getElementById('quizBtn').onclick=()=>showQuizLib();
  document.getElementById('restartBtn').onclick=()=>{
    const card=el('div','mcard');
    card.append(el('div','qk','Restart'));
    card.append(el('h4','','Start the game over?'));
    card.insertAdjacentHTML('beforeend','<p>'+GAME.restartCopy+'</p>');
    const f=el('div','mfoot');f.style.gap='10px';
    const c=el('button','cta ghost','Cancel');c.onclick=closeModal;
    const r=el('button','cta big','Restart');r.onclick=restartGame;
    f.append(c,r);card.append(f);
    openModal(card,true);
  };
  /* light is the default: these games are read in offices, on projectors */
  let THEME=lsGet(GAME.themeKey)||'light';
  applyTheme(THEME);
  document.getElementById('themeBtn').onclick=()=>{
    THEME=THEME==='light'?'dark':'light';
    lsSet(GAME.themeKey,THEME);
    applyTheme(THEME);
  };
  /* one-time phone tip: how to move through wide scenes on a small screen */
  const mtip=document.getElementById('mobiletip');
  if(mtip){
    if(matchMedia('(max-width:740px)').matches&&!lsGet(GAME.tipKey))mtip.style.display='flex';
    mtip.querySelector('button').onclick=()=>{mtip.style.display='none';lsSet(GAME.tipKey,'1');};
  }
  setAudit();renderChips();
}
function applyTheme(t){
  if(t==='light')document.documentElement.dataset.theme='light';
  else delete document.documentElement.dataset.theme;
  document.getElementById('themeBtn').textContent=t==='light'?'☾ dark':'☀ light';
}
/* ================= title ================= */
function titleScreen(){
  setWhere(GAME.where);clearStage();renderChips();

  h.append(el('h1','','Two books go bad.<br>Make the cover <em>count</em>.'));
  h.append(el('p','','You are a consulting actuary. This winter, two Zurich insurers call in the same month. Limmat priced its cover too low and loses money from day one. Clearbook Assurance priced well, then took a claims shock. You advise both on the reinsurance to buy, then work through ten meetings showing what it does to their accounts.'));
  const btns=el('div','btns');
  const done=Object.keys(S.done).length;
  const finished=!!(S.done.audit&&S.capstoneDone);
  if(finished){document.getElementById('ledgerchips').innerHTML='';}
  const b=el('button','cta big', finished?'Work the case again':(done?'Continue: '+ROOM_NAMES[ROOM_ORDER[Math.min(done,ROOM_ORDER.length-1)]]:'Take the case →'));
  b.onclick=()=>{ if(finished){S=freshState();ledgerFromState();renderChips();setAudit();tokenAt='slip';}
    S.started=true;save();renderMap(); };

    const r=el('button','cta ghost','Revisit the closed case');

  h.append(btns);
  /* what the player is signing up for, before they start: how long, whether it
     saves, and where they are in it if they have started already */
  if(!finished){
    const n=Math.min(done,ROOM_ORDER.length);
    const act=n<ACT_A.length?'Act One':'Act Two';
    h.append(el('p','fy', done
      ? 'You are on meeting '+Math.min(n+1,ROOM_ORDER.length)+' of '+ROOM_ORDER.length+', in '+act+'. Around '+Math.max(5,Math.round((ROOM_ORDER.length-n)*4.5))+' minutes left. Progress saves in this browser as you go, so you can stop whenever you like.'
      : 'Ten meetings in two acts, about 45 minutes. Progress saves in this browser, so you can stop and come back. Nothing is timed. A wrong answer costs nothing you cannot earn back.'));
  }

/* ================= the case files: two companies on one desk =================
   Act One runs across the top row: Limmat Assurance, three meetings, a loss
   loss-making at signing. Act Two fills the rows below: Clearbook Assurance, seven
   meetings, a loss caused by a shock. One broker and one reinsurer sit across
   both tables. The case file is the game's avatar; rideTo slides it along the
   paper trail, and the amount on its label is whatever the case is carrying. */
const ST_W=272, ST_H=196, GAP=24, X0=32;
const ROWS=[['slip','desk','shortyear'],
            ['renewal','booking','workpaper','mirror'],
            ['posting','runoff','audit']];
const TRAIL=[380,870,1168];             /* the trail under each row */
const BOX_Y=TRAIL.map(t=>t-ST_H-22);
const LINE_W=X0*2+4*ST_W+3*GAP;
const LINE_H=TRAIL[2]+120;
/* meeting id -> {x, y, row, bx}: where its card sits and where the file stands */
const ST_POS={};
ROWS.forEach((row,r)=>{
  const rowW=row.length*ST_W+(row.length-1)*GAP;
  const off=Math.round((LINE_W-rowW)/2);
  row.forEach((id,c)=>{ST_POS[id]={x:off+c*(ST_W+GAP)+ST_W/2, y:TRAIL[r], row:r, bx:off+c*(ST_W+GAP)};});
});

let tokenAt=S.done.audit?'audit':ROOM_ORDER[Math.max(0,Math.min(Object.keys(S.done).length,ROOM_ORDER.length-1))];
if(!ST_POS[tokenAt])tokenAt='slip';

/* the case file in hand: its label is whatever the current case carries */
function token(x,y,s,stage){
  const T={
    'a-blank':{amt:'#8b98aa',label:'PA-26'},

    gold: {amt:'#d9a648',label:fmt(RECOVERY)},
    spent:{amt:'#4a586b',label:'0'},
  }[stage]||{amt:'#8b98aa',label:'—'};
  return `<g class="token" transform="translate(${x},${y}) scale(${s})">
    <ellipse cx="0" cy="28" rx="28" ry="6" fill="#000" opacity=".28"/>
    <g class="tok-bob">${person(8,-36,0.72,'#d9a648','#6b5222','avatar')}</g>

    </g>

/* what the file's label reads as it leaves each meeting */
function tokenStage(){
  if(S.done.runoff||S.done.audit)return 'spent';
  if(S.done.mirror||S.done.posting)return 'gold';
  if(S.done.workpaper)return 'split';
  if(S.done.renewal)return 'raw';
  if(S.done.shortyear)return 'b-blank';
  if(S.done.desk)return 'a-gold';
  if(S.done.slip)return 'a-raw';
  return 'a-blank';
}

let RIDING=false;
/* the file is carried along the trail; between rows it takes the hand-off at
   the edges, so the whole thing reads as one continuous walk through time */
async function rideTo(id,sc){
  const cargo=sc.querySelector('#cargo');
  const from=ST_POS[tokenAt], to=ST_POS[id];
  tokenAt=id;
  if(RM||!cargo||document.hidden||(from.x===to.x&&from.y===to.y))return;
  /* along the lane you are on, then straight across to the one you want. The
     old route ran out to the edge of the map and back, which walked the same
     ground twice, very obvious when the walk is backwards. */
  const legs = from.row===to.row
    ? [{x:to.x,y:to.y}]
    : [{x:to.x,y:from.y},{x:to.x,y:to.y}];
  cargo.classList.add('walking');
  let cur={x:from.x,y:from.y};
  for(const pt of legs){
    const dist=Math.hypot(pt.x-cur.x,pt.y-cur.y);
    const dur=Math.max(180,dist/0.55);
    const anim=cargo.animate(
      [{transform:`translate(${cur.x}px,${cur.y}px)`},{transform:`translate(${pt.x}px,${pt.y}px)`}],
      {duration:dur,easing:legs.length===1?'ease-in-out':'linear',fill:'forwards'});
    await Promise.race([anim.finished.catch(()=>{}), new Promise(r=>setTimeout(r,dur+400))]);
    cur=pt;
  }
  cargo.classList.remove('walking');
  await new Promise(r=>setTimeout(r,120));
}
