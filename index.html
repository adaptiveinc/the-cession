        q:'What goes in the accounts on the day the cohort is recognized?',
        options:[
          {t:'A loss of '+fmt(NA.lc)+' in P&L today, recorded by a loss component. No CSM exists',ok:true,why:'A group that is onerous at initial recognition books its loss <strong>immediately</strong> (paragraph 47). The fulfilment cash flows exceed the premiums by '+fmt(NA.lc)+'. That amount goes to P&amp;L on day one, and a loss component of the same amount is set up in the liability for remaining coverage.'},
          {t:'A negative CSM of −'+fmt(NA.lc)+', released over the two coverage years',why:'The CSM cannot go below zero (paragraphs 38 and 47). A negative CSM would spread a loss you already know about over future years. The standard does not allow that.'},
          {t:'Nothing yet: the loss is recognized as the claims actually arrive',why:'The loss is measured on expected cash flows, not on cash paid. Those cash flows are already short today. The loss is recognized when it is identified, not when claims are paid (paragraph 47).'}],
        cite:['47','16']},fresh);
      faced=true;P.gap=1;save();g.classList.add('done');
      if(fresh&&count()<3)setObjective('Objective: face the pricing <b>'+count()+'/3</b>');
      if(fresh)applyDeltas({alc:NA.lc});
      reveal();
      maybeEnd();},
    grouping:async(g)=>{
      if(g.classList.contains('done'))return;
      await talk(sc,[
        {w:'cuo',n:'D. Meier',t:'“Fine. But we write plenty of profitable accident business. Put this cohort in the same group as the Q3 book and the group as a whole is still fine. No loss, no headline.”'},
      ]);
      await quiz({kicker:'Meier’s idea',pts:QUESTION_PTS,
        intro:'<div class="memo"><strong>The proposal:</strong> pool the onerous PA-2026 cohort with profitable business written the same year, so the combined group shows no loss.</div>',
        q:'Can the loss be absorbed by grouping?',
        options:[
          {t:'No. Contracts onerous at initial recognition go into their own group',ok:true,why:'Paragraph 16 splits a portfolio into at least three groups: contracts <strong>onerous at initial recognition</strong>, contracts with no significant chance of becoming onerous, and the rest. Paragraph 22 adds a split by underwriting year. The onerous group exists so a known day-one loss cannot be hidden in another group’s profit.'},
          {t:'Yes, if the profitable business is in the same annual cohort',why:'The annual cohort (paragraph 22) only splits groups further, by underwriting year. It never merges an onerous group into a profitable one.'},
          {t:'Yes, at portfolio level: losses net against expected profits of similar risks',why:'Measurement happens at group level, not portfolio level. The onerous group is measured on its own (paragraphs 16 and 24).'}],
        cite:['16','22']},fresh);
      grouped=true;P.grouping=1;save();
      if(fresh&&count()<3)setObjective('Objective: face the pricing <b>'+count()+'/3</b>');
      maybeEnd();},
    when:async(g)=>{
      if(g.classList.contains('done'))return;
      await talk(sc,[
        {w:'bro',n:'K. Odermatt · broker',t:'“I heard. Half of Bahnhofstrasse heard, Meier was not quiet. Turicum Re would quote a quota share on the cohort. One question: when do you want it signed?”'},
      ]);
      await quiz({kicker:'The only window',pts:QUESTION_PTS,
        intro:'<div class="memo"><strong>The timing condition (B119C):</strong> a loss-recovery component only arises where the reinsurance contract held was entered into <b>before or at the same time as</b> the onerous underlying contracts were recognized.</div>',
        q:'PA-2026 is recognized today. When must the reinsurance treaty be signed so the loss this year can be covered?',
        options:[
          {t:'Today or earlier. Sign tomorrow and this loss recovers nothing, ever',ok:true,why:'B119C sets the cut-off at the day the underlying contracts are recognized. A treaty signed on or before that day covers the loss, and the recovery is booked (paragraph 66A). A treaty signed after does not. Otherwise you could buy income after the loss is known. So the treaty has to be signed <em>today</em>.'},
          {t:'Any time while the loss component is still open',why:'The test is when the treaty was <em>signed</em>, not whether the loss component is still open (B119C).'},
          {t:'Before the annual close, since recognition is a year-end event',why:'Contracts are recognized when they are issued, not at the year-end close. The cut-off is today.'}],
        cite:['B119C','66A']},fresh);
      timed=true;P.when=1;save();
      if(fresh&&count()<3)setObjective('Objective: face the pricing <b>'+count()+'/3</b>');
      maybeEnd();},
  });
  if(fresh){
    const mk=id=>{const g=[...sc.querySelectorAll('.hs')].find(h=>h.dataset.hs===id);if(g)g.classList.add('done');};
    if(faced){mk('gap');reveal();} if(grouped)mk('grouping'); if(timed)mk('when');
    if(count()&&count()<3)setObjective('Objective: face the pricing <b>'+count()+'/3</b>');
  } else {reveal();doorOut(sc,'To the cession desk →');}
}

          {t:N.share.toFixed(2)+' ('+N.allocation.toFixed(2)+' × '+N.ratio.toFixed(2)+'), since half of the covered part of the underlying cohort is recoverable',ok:true,why:'The recovery ratio is <strong>expected recoveries over covered claims</strong> (B119D): '+fmt(N.ceded)+' / '+fmt(N.covered)+' = '+N.ratio.toFixed(2)+'. The recovery share is the two factors multiplied: <strong>'+N.share.toFixed(2)+'</strong>. Every contract in the group carries it. Check: for a quota share the ratio equals the cession, and '+N.ratio.toFixed(2)+' is the cession.'},

         <p><strong>Why it matters.</strong> A CSM turns into a loss component by cohort, so the recovery has to be calculated by cohort, not by single underlying contract. Within a cohort, one contract can be profitable while the others are very negative and turn the whole cohort onerous. If the treaty covers the profitable contract and the recovery is calculated by applying the quota share only to that contract, there is no recovery income for the cohort at all:</p>

        ['B119E','47–48']);
      whyed=true;P.why=1;save();
      if(fresh&&count()<3)setObjective('Objective: work out the share <b>'+count()+'/3</b>');

  });

}

  let one=!!P.one||!fresh, two=!!P.stamped||!fresh, adj=!!P.adjust||!fresh, why=!!P.why||!fresh;
  const count=()=>[one,two,adj,why].filter(Boolean).length;
  const maybeEnd=()=>{ if(count()<4||S.done.posting)return; completeRoom('posting');
    setObjective('Meeting closed · both entries posted');doorOut(sc,'On to the year-end closes →'); };
  bindHotspots(sc,{
    stamp:async(g)=>{
      if(g.classList.contains('done'))return;
      await talk(sc,[
        {w:'aud',n:'Auditor',t:'“One number, two entries. Everyone remembers the first. Show me you know why there is a second.”'},
      ]);
      await quiz({kicker:'The first entry · which income line',pts:QUESTION_PTS,
        ctx:'<div class="memo"><strong>What the books show:</strong> <b>'+fmt(RECOVERY)+'</b> of income on the treaty held. Motor-2026 was <b>profitable at inception</b> and turned onerous in 2027 when its CSM was exhausted.</div>',
        q:'Which of the loss-recovery lines does it belong on?',
        options:[
          {t:'Recovery of losses on contracts turning onerous',ok:true,why:'Clearbook splits the recovery by <strong>how the loss arose</strong>. This cohort was profitable when written and turned onerous later, when the CSM ran out. So the income goes on <strong>recovery of losses on contracts turning onerous</strong>. A reader can then tell business priced badly on day one from business that went wrong later.<br><br>Paragraph 86 does not require these two lines. It only requires the reinsurance result to be shown separately from the issued-contract result. The split is Clearbook\u2019s own policy.'},
          {t:'Recovery of losses on onerous underlying contracts',why:'That line is for groups that were <strong>onerous at initial recognition</strong>. Motor-2026 was profitable in 2026 and turned onerous in 2027.'},
          {t:'Changes in expected loss recoveries',why:'That is for movements in a recovery already recognized, which is where the 2028 increase goes. This is the first recognition of the recovery, not a change to it.'}],
        cite:['66A','B119D']},fresh);
      one=true;P.one=1;save();g.classList.add('done');
      if(fresh&&count()<4)setObjective('Objective: post both entries <b>'+count()+'/4</b>');
      await punch('#die1'); lift('#copy1');
      maybeEnd();},
    stamp2:async(g)=>{
      if(g.classList.contains('done'))return;
      if(!one){await teach('The first entry first','<p>Post in order. Take the income line first, then come back for the second.</p>');return;}
      /* the double-count demo: the wrong answer is shown as a consequence, not just marked wrong */
      await quiz({kicker:'The second entry',pts:QUESTION_PTS,
        ctx:'<div class="memo"><strong>Booked so far:</strong> income of <b>'+fmt(RECOVERY)+'</b> as recovery of losses. The 2027 review was <b>'+fmt(N.det2027)+'</b> adverse; the group\u2019s own CSM absorbed <b>'+fmt(CSM_2027)+'</b> of it and the excess <b>'+fmt(FLIP_LC)+'</b> became the loss component. The treaty CSM has already taken <b>'+fmt(CEDED_CSM_ADJ)+'</b>, mirroring the absorbed part.</div>',
        q:'Income was the first entry. Where does the matching second entry go?',
        options:[
          {t:'On the balance sheet, as the loss-recovery component of the reinsurance asset. It is the part of the review that does <em>not</em> go to the treaty CSM',ok:true,why:'Both entries are real: the income in P&amp;L, and the same <strong>'+fmt(RECOVERY)+'</strong> on the balance sheet as the <strong>loss-recovery component</strong> of the asset for remaining coverage (paragraph 66B).<br><br>Follow the whole review. '+fmt(N.det2027)+' of worse claims, mirrored at '+N.share.toFixed(2)+', is <strong>'+fmt(r2(N.det2027*N.share))+'</strong> of change on the treaty. Of that, '+fmt(CSM_2027)+' \u00d7 '+N.share.toFixed(2)+' = <strong>'+fmt(CEDED_CSM_ADJ)+'</strong> mirrors what the group\u2019s own CSM absorbed, and adjusts the treaty CSM in the normal way. The rest, '+fmt(FLIP_LC)+' \u00d7 '+N.share.toFixed(2)+' = <strong>'+fmt(RECOVERY)+'</strong>, mirrors the loss component. That is the amount in front of you. It goes to P&amp;L and to the <strong>loss-recovery component</strong>.'},
          {t:'Against the treaty CSM, on top of the '+fmt(CEDED_CSM_ADJ)+' it already took',why:'Then the treaty CSM would move by the whole '+fmt(r2(N.det2027*N.share))+', and the '+fmt(RECOVERY)+' would count twice: as income now and as margin still to be earned. Paragraph 66(c) splits the change to stop that. The part matching what the underlying CSM absorbed goes to the treaty CSM. The part matching the loss component is excluded.'},
          {t:'Nowhere. Income is income and the entry is complete',why:'The books would not balance. '+fmt(RECOVERY)+' of income means the reinsurance asset is worth '+fmt(RECOVERY)+' more. That increase is recorded as the loss-recovery component.'}],
        cite:['66B','66(c)']},fresh);

      await punch('#die2'); lift('#copy2');

      await talk(sc,[
        {w:'sys',t:'The second entry posts to the balance sheet. The treaty CSM does not move: <b>'+fmt(N.cededCsm0)+'</b> before, <b>'+fmt(N.cededCsm0)+'</b> after.'},
        {w:'aud',n:'Auditor',t:'“And that is the entry people get wrong. They go to the CSM because it feels like the income has to come out of something. It does not. It was never in the CSM.”'},
      ]);
      maybeEnd();},
    adjust:async(g)=>{
      if(g.classList.contains('done'))return;
      await quiz({kicker:'2028 · the increase',pts:QUESTION_PTS,
        ctx:'<div class="memo"><strong>A year on:</strong> Motor-2026 is already onerous, and future claims worsen by a further <b>'+fmt(N.det2028)+'</b>. There is no CSM left to absorb it, so the whole amount adds to the loss component.</div>',
        q:'What does the treaty book, and on which line?',
        options:[
          {t:fmt(N.det2028)+' × '+N.share.toFixed(2)+' = '+fmt(ROLLS[2].lorc)+', booked as a change in expected loss recoveries',ok:true,why:'This is a movement of the loss component like any other. It grows by '+fmt(N.det2028)+', so the loss-recovery component grows by <strong>'+fmt(ROLLS[2].lorc)+'</strong>, with '+fmt(ROLLS[2].lorc)+' of income. It is a change to a recovery already recognized, so it is presented as a <strong>change in expected loss recoveries</strong>, not a new recovery.<br><br>The treaty CSM takes <strong>nothing</strong> this time. In 2027 the review was split, because the group still had '+fmt(CSM_2027)+' of CSM to absorb part of it. By 2028 that CSM is gone. The whole '+fmt(N.det2028)+' goes to the loss component, the whole mirror is excluded by paragraph 66(c), and nothing is left to adjust the treaty CSM.'},
          {t:fmt(ROLLS[2].lorc)+' as a change in expected loss recoveries, and the treaty CSM is adjusted by the same amount',why:'None of this deterioration adjusted the underlying CSM, because there is none left. So paragraph 66(c) excludes all of its mirror from the treaty CSM. The 2027 review moved the treaty CSM only because the group still had CSM to absorb part of it.'},
          {t:'Nothing. The recovery was fixed when it was first recognized at '+fmt(RECOVERY),why:'The loss-recovery component is not a fixed amount; it mirrors the loss component through its whole life. When the loss component moves, so does the mirror.'}],
        cite:['66(c)','B119D']},fresh);
      adj=true;P.adjust=1;save();
      if(fresh&&count()<4)setObjective('Objective: post both entries <b>'+count()+'/4</b>');
      maybeEnd();},
    /* the run-off rule, which the closes then rely on */
    runoffrule:async(g)=>{
      if(g.classList.contains('done'))return;
      await quiz({kicker:'Which movements come back for a second entry',pts:QUESTION_PTS,
        ctx:'<div class="memo"><strong>Six movements</strong> carry the loss component over its life: the loss when the group turned onerous, the further deterioration in 2028, interest each year, and the reversals as the cover is given. All six are mirrored onto the loss-recovery component.</div>',
        q:'Which of them adjust the treaty CSM?',
        options:[
          {t:'None of them. Every one is a movement of the loss component, and a loss component never adjusted the group\u2019s own CSM',ok:true,why:'All six are movements of the <strong>loss component</strong>. A loss component exists because the group\u2019s CSM could not absorb the amount, so none of these adjusted the underlying CSM. Paragraph 66(c) therefore keeps all of their mirrors out of the treaty CSM. All six move the loss-recovery component and go through P&amp;L.<br><br>The treaty CSM did move once. It took <strong>'+fmt(CEDED_CSM_ADJ)+'</strong> in 2027, mirroring the '+fmt(CSM_2027)+' the group\u2019s CSM <em>did</em> absorb. That amount never entered the loss component, so it is not one of the six. It is the other half of the same review.'},
          {t:'The two loss events, 2027 and 2028. Interest and the reversals must not',why:'That sounds like a rule, but it is not. All six are loss-component movements, so none of them adjusts the underlying CSM and none of their mirrors goes to the treaty CSM. What moved the treaty CSM in 2027 was the other part of the review, the part the group\u2019s CSM absorbed, which never became loss component.'},
          {t:'All six. The mirror copies every movement, so every movement adjusts both',why:'Every movement is mirrored onto the loss-recovery component, yes. But the treaty CSM is not a second mirror. It moves only for the part of a change that also adjusted the underlying CSM (paragraph 66(c)), or for the 66A adjustment on a group onerous at inception.'}],
        cite:['66A','66(c)']},fresh);
      why=true;P.why=1;save();
      if(fresh&&count()<4)setObjective('Objective: post both entries <b>'+count()+'/4</b>');
      maybeEnd();},
  });
  if(fresh){
    const mk=id=>{const g=[...sc.querySelectorAll('.hs')].find(h=>h.dataset.hs===id);if(g)g.classList.add('done');};
    if(one){mk('stamp');lift('#copy1');} if(adj)mk('adjust'); if(why)mk('runoffrule');
    if(two){mk('stamp2');lift('#copy2');}
    if(count()&&count()<4)setObjective('Objective: post both entries <b>'+count()+'/4</b>');
  } else {lift('#copy1');lift('#copy2');doorOut(sc,'On to the year-end closes →');}
}
/* ================= MEETING 6: THE RUN-OFF =================
   One column is one year-end close. Each close accretes interest and
   releases for service; the loss-recovery component steps down beside
   the loss component at exactly 0.3 times its height, because the mirror
   copies every roll. */
async function stationRunoff(){
  const fresh=!S.done.runoff;
  const {sc,mount}=sceneShell('runoff', fresh?'Objective: close the years <b>0/2</b>':'Done · read it again');
  /* the two balances at each close: LC and its mirror */
  const LCV=[FLIP_LC, ROLLS[3].bal, 0], RCV=LCV.map(v=>r2(v*N.share));
  /* running loss-recovery balances, from the table itself (franc rounding
     makes these differ from share x LC balance by a franc mid-life) */
  const PRE28=r2(RECOVERY+ROLLS[1].lorc+ROLLS[2].lorc);   /* 9'435 */
  const OPEN29=r2(PRE28+ROLLS[3].lorc);                   /* 4'717 */
  const PRE29=r2(OPEN29+ROLLS[4].lorc);                   /* 5'189 */
  const CX=[190,405,620], BASE=410, K=11;
  const col=i=>{
    const lch=Math.max(3,LCV[i]/1000*K), rch=Math.max(3,RCV[i]/1000*K);
    return `<g id="yr${i}" opacity="${i===0?1:.22}">
      <rect x="${CX[i]-52}" y="${BASE-lch}" width="44" height="${lch}" rx="3" fill="#e06a5e" opacity=".8"/>

      <text x="${CX[i]+30}" y="${BASE-rch-10}" text-anchor="middle" font-family="var(--mono)" font-size="12.5" font-weight="700" fill="#d9a648">${fmt(RCV[i])}</text>
      <text x="${CX[i]}" y="${BASE+22}" text-anchor="middle" font-family="var(--mono)" font-size="10" letter-spacing="1.6" fill="#8b98aa">YE ${2027+i}</text>
    </g>`;};
  mount(`<svg viewBox="0 0 ${FR.W} ${FR.H}">
    ${frame('ONE COLUMN IS ONE YEAR-END','#1e2a3e')}
    ${plate(84,164,596,282,'#141d2e')}
    <text x="${FR.FOCUS.cx}" y="150" text-anchor="middle" font-family="var(--mono)" font-size="9.5" letter-spacing="1.8" fill="#5d6b7e">TWO BALANCES RUNNING OFF TOGETHER · <tspan fill="#e06a5e">LC</tspan> AND <tspan fill="#d9a648">LoRC, ALWAYS ×${N.share.toFixed(2)}</tspan></text>
    <path d="M100,${BASE} H660" stroke="#2c394a" stroke-width="1.5"/>
    ${col(0)}${col(1)}${col(2)}
    <text id="yearlabel" x="380" y="184" text-anchor="middle" font-family="var(--mono)" font-size="12" letter-spacing="2.4" fill="#8b98aa">2027 CLOSE</text>
    ${rail('LOSS-RECOVERY COMPONENT · MOVEMENTS',`<g id="rolllines"></g>`)}
    ${CAST.torres(524)}${CAST.you(644)}${CAST.brandt(764)}
    ${hotspot(110,428,'!','lap','','CLOSE A YEAR')}
    <circle cx="764" cy="421" r="2.5" fill="#8b98aa"/><circle cx="764" cy="412" r="3.5" fill="#8b98aa"/>${hotspot(764,376,'?','lockstep','q','THE TALLER BAR')}
  </svg>`);
  const P=prog('runoff');
  let lap=P.lap||(fresh?0:2), locked=!!P.lockstep||!fresh;
  const yearlabel=sc.querySelector('#yearlabel'), rolllines=sc.querySelector('#rolllines');
  /* redraw the roll table for everything booked so far, and light the closed years */
  function paint(){
    const shown=[0].concat(LAPS.slice(0,lap).flat().filter(i=>i>0));
    let bal=0, y=FR.RAIL.y+62, out='';
    for(const i of shown){const r=ROLLS[i];bal=r2(bal+r.lorc);
      out+=`<text x="${FR.RAIL.x+20}" y="${y}" font-family="var(--mono)" font-size="11.5" fill="#8b98aa">${r.yr}</text>`
         + `<text x="${FR.RAIL.x+74}" y="${y}" font-family="var(--mono)" font-size="11.5" fill="${r.event?'#d9a648':'#72b7cc'}">${r.line}</text>`
         + `<text x="${FR.RAIL.x+142}" y="${y}" font-family="var(--mono)" font-size="11" fill="#c9d3df">${r.roll}</text>`
         + `<text x="${FR.RAIL.x+330}" y="${y}" text-anchor="end" font-family="var(--mono)" font-size="11.5" fill="${r.lorc<0?'#e06a5e':'#63b380'}">${r.lorc>0?'+':''}${fmt(r.lorc)}</text>`
         + `<text x="${FR.RAIL.x+394}" y="${y}" text-anchor="end" font-family="var(--mono)" font-size="11.5" fill="#e7ecf3">${fmt(bal)}</text>`;
      y+=28;}
    if(lap>=2){out+=`<line x1="${FR.RAIL.x+250}" y1="${y-18}" x2="${FR.RAIL.x+394}" y2="${y-18}" stroke="#2c394a"/>`
      +`<text x="${FR.RAIL.x+142}" y="${y+6}" font-family="var(--mono)" font-size="11.5" fill="#63b380">LIFETIME SUM</text>`
      +`<text x="${FR.RAIL.x+330}" y="${y+6}" text-anchor="end" font-family="var(--mono)" font-size="13" fill="#63b380">${fmt(r2(shown.reduce((t,i)=>t+ROLLS[i].lorc,0)))}</text>`;}
    rolllines.innerHTML=out;
    for(let i=0;i<3;i++){const g=sc.querySelector('#yr'+i);
      if(g){g.style.transition='opacity .9s';g.style.opacity=(i<=lap)?1:.22;}}
    yearlabel.textContent=['2027 CLOSE','2028 CLOSE','2029 · NOTHING LEFT ON EITHER BAR'][Math.min(lap,2)];
  }
  const maybeEnd=()=>{ if(!(lap>=2&&locked)||S.done.runoff)return; completeRoom('runoff');
    setObjective('Meeting closed · nothing left to run off');doorOut(sc,'Walk in to the sign-off →'); };
  bindHotspots(sc,{
    lap:async(g)=>{
      if(g.classList.contains('done'))return;
      if(lap===0){
        await talk(sc,[
          {w:'chief',n:'V. Torres · 2028 close',t:'“Two things happen at every close. The balance earns interest at <span class="num">10%</span>, and part of it is released as we receive the cover.”'},
          {w:'chief',n:'V. Torres · 2028 close',t:'“And this year there is a third: the claims outlook worsens again by <span class="num">'+fmt(N.det2028)+'</span>, so the loss component grows, and the mirror grows with it.”'},
        ]);
        await quiz({kicker:'First close · 2028',pts:QUESTION_PTS,
          ctx:'<div class="memo"><strong>Opening loss-recovery component '+fmt(RECOVERY)+'.</strong> Interest <b>10%</b> gives <b>'+fmt(ROLLS[1].lorc)+'</b>. The 2028 deterioration adds <b>'+fmt(ROLLS[2].lorc)+'</b>. Half of what is then left is released for the cover given this period.</div>',
          q:'At the 2028 year-end, how much is reversed, and what is left on the books?',
          options:[
            {t:'Reversal of '+fmt(Math.abs(ROLLS[3].lorc))+', closing at '+fmt(OPEN29),ok:true,why:'Balance before the release: '+fmt(RECOVERY)+' + '+fmt(ROLLS[1].lorc)+' + '+fmt(ROLLS[2].lorc)+' = <strong>'+fmt(PRE28)+'</strong>. Half of it, <strong>'+fmt(Math.abs(ROLLS[3].lorc))+'</strong>, is reversed as a <strong>reversal of loss recoveries</strong>, leaving <strong>'+fmt(OPEN29)+'</strong>. Same order as the underlying: interest, then changes in future service, then the release for the period.'},
            {t:'Reversal of '+fmt(r2(RECOVERY*0.5))+', half the opening balance, closing at '+fmt(r2(PRE28-RECOVERY*0.5)),why:'That releases from the balance before this year’s interest and deterioration. The release comes last, on the updated balance, the same as on the underlying CSM.'},
            {t:'No reversal: the year closes at the full '+fmt(PRE28)+', held until the loss component is gone',why:'The loss component is running off, and the mirror copies every movement. Holding the recovery flat while the loss shrinks would breach the cap (B119F).'}],
          cite:['B119F','66A']},fresh);
        if(fresh)for(const i of LAPS[0].filter(x=>x>0)){const r=ROLLS[i];
          applyDeltas({lc:r.lc,lorc:r.lorc,pnl:r.lorc});}
        lap=1;P.lap=1;save();paint();
        if(fresh)setObjective('Objective: close the years <b>1/2</b>');
      } else {
        await quiz({kicker:'Second close · 2029',pts:QUESTION_PTS,
          ctx:'<div class="memo"><strong>Opening '+fmt(OPEN29)+'.</strong> Interest <b>10%</b> gives <b>'+fmt(ROLLS[4].lorc)+'</b>. This is the last year of cover: all the remaining service is received.</div>',
          q:'How does the balance end?',
          options:[
            {t:'Reversal of the whole '+fmt(Math.abs(ROLLS[5].lorc))+', closing at 0',ok:true,why:'The last of the cover is received, so the last of the recovery is reversed: '+fmt(OPEN29)+' + '+fmt(ROLLS[4].lorc)+' = <strong>'+fmt(Math.abs(ROLLS[5].lorc))+'</strong>, all of it. The loss-recovery component closes at <strong>zero</strong>, the same as the loss component. Nothing is left on the balance sheet, because the mirror runs off <em>with</em> the loss component, not on its own schedule.'},
            {t:'Half again: reversal of '+fmt(r2(PRE29/2))+', leaving the rest to write off later',why:'Halving was the pattern, not a rule. In the final year all remaining cover is received, so all the remaining balance is reversed.'},
            {t:'It stays at '+fmt(Math.abs(ROLLS[5].lorc))+' until the treaty is commuted',why:'The recovery relates to cover. When the cover ends, nothing is left for it to relate to. It cannot outlive the loss component.'}],
          cite:['B119F','66A']},fresh);
        if(fresh)for(const i of LAPS[1]){const r=ROLLS[i];
          applyDeltas({lc:r.lc,lorc:r.lorc,pnl:r.lorc});}
        lap=2;P.lap=2;save();paint();g.classList.add('done');
        await talk(sc,[
          {w:'sys',t:'The 2029 close posts and both columns come down to zero together. Loss component zero, loss-recovery component zero. The case has nothing left to carry.'},
          {w:'cfo',n:'M. Brandt · CFO',t:'“Three years of entries and it all nets to nothing? Someone will have to explain to me what I paid Turicum Re for.”'},
          {w:'chief',n:'V. Torres',t:'“Someone will. At the sign-off, with the auditor in the room.”'},
        ]);
        if(fresh)setObjective('Objective: close the years <b>2/2</b>');
        if(!locked)setObjective('Objective: <b>read THE TALLER BAR</b> before the sign-off');
        maybeEnd();
      }},
    lockstep:async(g)=>{
      if(g.classList.contains('done'))return;
      await quiz({kicker:'The taller bar',pts:QUESTION_PTS,
        ctx:'<div class="memo"><strong>The two balances, side by side at every close.</strong> The <b>loss component</b> and the <b>loss-recovery component</b>: '+fmt(FLIP_LC)+' against '+fmt(RECOVERY)+' when the group turned onerous, '+fmt(ROLLS[3].bal)+' against '+fmt(OPEN29)+' after 2028, zero against zero at the end. The recovery is '+N.share.toFixed(2)+' of the loss every single time.</div>',
        q:'Why do the two balances always move together, with nothing checking them against each other?',
        options:[
          {t:'Because the recovery is defined as the loss scaled by '+N.share.toFixed(2)+', movement by movement',ok:true,why:'The loss-recovery component is not measured on its own and then compared. Every movement of the loss component is copied onto the treaty, multiplied by the share. So the recovery <em>is</em> '+N.share.toFixed(2)+' of the loss at every point. It is built that way, so it cannot drift. That is also why the cap needs no separate test (B119F), and why both get to zero together.'},
          {t:'Because both are released at 50% a year, so they happen to follow the same schedule',why:'They would drift apart as soon as the schedules differed. 2028 already shows this: the deterioration is not a release, yet the two still move together. It is the scaling, not the schedule.'},
          {t:'Because a reconciliation runs each period and corrects the recovery to match',why:'Nothing reconciles them. The scaling makes that unnecessary.'}],
        cite:['B119F','B119D']},fresh);
      locked=true;P.lockstep=1;save();
      if(lap>=2&&!S.done.runoff)setObjective('Objective: close the years <b>2/2</b>');
      maybeEnd();},
  });
  paint();
  if(fresh){
    const mk=id=>{const g=[...sc.querySelectorAll('.hs')].find(h=>h.dataset.hs===id);if(g)g.classList.add('done');};
    if(lap>=2)mk('lap'); if(locked)mk('lockstep');
    if(lap===1)setObjective('Objective: close the years <b>1/2</b>');
    else if(lap>=2&&!locked)setObjective('Objective: <b>read THE TALLER BAR</b> before the sign-off');
  } else doorOut(sc,'Walk in to the sign-off →');
}
/* ================= MEETING 7: THE SIGN-OFF =================
   The auditor foots the file. Income, interest and reversals must come to exactly zero
   over the life of the case. That zero is the lesson: recovery income is
   timing, not profit, and the treaty's worth lives somewhere else. */
async function stationAudit(){
  const fresh=!S.done.audit;
  const {sc,mount}=sceneShell('audit', fresh?'Objective: close the case <b>0/3</b>':'Done · read it again');
  const income=ROLLS.filter(r=>r.lorc>0), out=ROLLS.filter(r=>r.lorc<0);
  const sumIn=r2(income.reduce((t,r)=>t+r.lorc,0)), sumOut=r2(out.reduce((t,r)=>t+r.lorc,0));
  /* paragraph 86: the service result and the finance result are presented apart */
  const svc=ROLLS.filter(r=>r.line!=='interest'), fin=ROLLS.filter(r=>r.line==='interest');
  const svcSum=r2(svc.reduce((t,r)=>t+r.lorc,0)), finSum=r2(fin.reduce((t,r)=>t+r.lorc,0));
  mount(`<svg viewBox="0 0 ${FR.W} ${FR.H}">
    ${frame('ONE LOSS, END TO END','#1e2a3e')}
    ${plate(90,140,580,290)}
    <rect x="90" y="140" width="580" height="34" rx="6" fill="#141d2e"/>
    <text x="110" y="162" font-family="var(--mono)" font-size="10" letter-spacing="1.8" fill="#8b98aa">LIFETIME RECONCILIATION · EVERY RECOVERY LINE OF THE CASE</text>
    <text x="230" y="242" text-anchor="middle" font-family="var(--mono)" font-size="26" font-weight="700" fill="#63b380">+${fmt(sumIn)}</text>
    <text x="230" y="266" text-anchor="middle" font-family="var(--mono)" font-size="9" letter-spacing="1.6" fill="#63b380">RECOGNIZED</text>
    <text x="530" y="242" text-anchor="middle" font-family="var(--mono)" font-size="26" font-weight="700" fill="#e06a5e">${fmt(sumOut)}</text>
    <text x="530" y="266" text-anchor="middle" font-family="var(--mono)" font-size="9" letter-spacing="1.6" fill="#e06a5e">REVERSED</text>
    <line x1="140" y1="296" x2="620" y2="296" stroke="#2c394a" stroke-width="1.5"/>
    <text id="verdict" x="380" y="346" text-anchor="middle" font-family="var(--mono)" font-size="24" font-weight="700" letter-spacing="2" fill="#5d6b7e">NET  —</text>
    <g id="signoff" style="opacity:0">
      <circle cx="288" cy="392" r="13" fill="#1b2b22" stroke="#63b38088" stroke-width="2"/>
      <path d="M282,392 L286,396 L295,386" stroke="#63b380" stroke-width="2.5" fill="none"/>
      <text x="312" y="397" font-family="var(--mono)" font-size="11" letter-spacing="1.6" fill="#63b380">SIGNED · GROUP AUDIT</text>
    </g>
    ${rail('THE TREATY\u2019S LINES, OVER THE WHOLE LIFE',(()=>{
      /* paragraph 86 keeps the service result and the finance result apart, so
         the schedule foots in two sections and not one blended column */
      const R=FR.RAIL; let y=R.y+50, out='';
      const head=t=>{out+=`<text x="${R.x+20}" y="${y}" font-family="var(--mono)" font-size="8.5" letter-spacing="1.3" fill="#5d6b7e">${t}</text>`;y+=19;};
      const row=r=>{const c=r.lorc<0?'#e06a5e':'#63b380';
        out+=`<text x="${R.x+28}" y="${y}" font-family="var(--mono)" font-size="11" fill="#8b98aa">${r.yr}</text>`
           + `<text x="${R.x+74}" y="${y}" font-family="var(--mono)" font-size="11" fill="${c}">${r.line}</text>`
           + `<text x="${R.x+392}" y="${y}" text-anchor="end" font-family="var(--mono)" font-size="11.5" fill="${c}">${r.lorc>0?'+':''}${fmt(r.lorc)}</text>`;y+=22;};
      const sub=(label,v)=>{
        out+=`<line x1="${R.x+250}" y1="${y-15}" x2="${R.x+392}" y2="${y-15}" stroke="#2c394a"/>`
           + `<text x="${R.x+74}" y="${y}" font-family="var(--mono)" font-size="10.5" fill="#8b98aa">${label}</text>`
           + `<text x="${R.x+392}" y="${y}" text-anchor="end" font-family="var(--mono)" font-size="12" fill="#c9d3df">${v>0?'+':''}${fmt(v)}</text>`;y+=26;};
      head('REINSURANCE SERVICE RESULT');svc.forEach(row);sub('subtotal',svcSum);
      head('REINSURANCE FINANCE INCOME');fin.forEach(row);sub('subtotal',finSum);
      out+=`<line x1="${R.x+250}" y1="${y-14}" x2="${R.x+392}" y2="${y-14}" stroke="#63b38066" stroke-width="1.5"/>`
         + `<text x="${R.x+74}" y="${y+4}" font-family="var(--mono)" font-size="11" fill="#63b380">LIFETIME SUM</text>`
         + `<text x="${R.x+392}" y="${y+4}" text-anchor="end" font-family="var(--mono)" font-size="14" font-weight="700" fill="#63b380">${fmt(r2(svcSum+finSum))}</text>`;
      return out;})())}
    ${CAST.aud(540)}${CAST.you(624)}${CAST.brandt(712)}
    ${hotspot(380,444,'!','weigh','','CHECK IT ADDS UP')}
    ${hotspot(1118,430,'?','where','q','WHERE EACH ONE GOES')}
    <circle cx="712" cy="421" r="2.5" fill="#8b98aa"/><circle cx="712" cy="412" r="3.5" fill="#8b98aa"/>${hotspot(712,376,'?','meaning','q','WHAT ZERO PROVES')}
  </svg>`);
  const verdict=sc.querySelector('#verdict'), signoff=sc.querySelector('#signoff');
  const P=prog('audit');
  let weighed=!!P.weigh||!fresh, placed=!!P.where||!fresh, meant=!!P.meaning||!fresh;
  const count=()=>[weighed,placed,meant].filter(Boolean).length;
  /* the schedule foots, and the sign-off goes on the file */
  const level=()=>{verdict.textContent='NET  '+fmt(r2(sumIn+sumOut));verdict.setAttribute('fill','#63b380');
    signoff.style.transition='opacity .6s';signoff.style.opacity=1;};
  const maybeEnd=()=>{ if(count()<3||S.done.audit)return; completeRoom('audit');
    setObjective('The case is closed');endOverlay(); };
  bindHotspots(sc,{
    weigh:async(g)=>{
      if(g.classList.contains('done'))return;
      await talk(sc,[
        {w:'aud',n:'Auditor',t:'“Last schedule in the file. Every recovery line this case produced, both directions. Add it up for me.”'},
      ]);
      await quiz({kicker:'Adding up the schedule',pts:QUESTION_PTS,
        ctx:'<div class="memo"><strong>Every recovery line this case produced.</strong> Recognized: '+income.map(r=>r.line+' '+fmt(r.lorc)).join(', ')+'. Reversed: '+out.map(r=>r.line+' '+fmt(r.lorc)).join(', ')+'.</div>',
        q:'Add them all up over the life of the case. What must the total be?',
        options:[
          {t:'Exactly zero',ok:true,why:'<strong>'+fmt(sumIn)+' recognized, '+fmt(Math.abs(sumOut))+' reversed, difference exactly zero.</strong> Every franc of recovery income that went into P&amp;L came back out as the cover was received. The recovery is a <em>timing</em> item: it puts income in the same period as the loss, then undoes itself. Paragraph 86 shows the two parts separately: the <strong>service result</strong> nets to '+fmt(svcSum)+' and the <strong>finance income</strong> to +'+fmt(finSum)+'. The interest is not extra profit. It is the unwind of discounting on a balance that is then fully released, so it is reversed with everything else. Only the two together come to zero.'},
          {t:'The original recovery of '+fmt(RECOVERY)+', which is the profit on the treaty',why:'That amount was recognized and then fully reversed. The treaty\u2019s profit is in its <em>own</em> CSM, which these lines never touched.'},
          {t:'The interest accreted, '+fmt(r2(ROLLS[1].lorc+ROLLS[4].lorc))+', since only that is genuinely earned',why:'The interest is inside the reversals as well. The balance it was added to is fully released, so the interest is released with it. The sum is zero including the interest.'}],
        cite:['66A','66B']},fresh);
      weighed=true;P.weigh=1;save();g.classList.add('done');
      if(fresh&&count()<3)setObjective('Objective: close the case <b>'+count()+'/3</b>');
      level();
      maybeEnd();},
    where:async(g)=>{
      if(g.classList.contains('done'))return;
      await quiz({kicker:'Where each number is reported',pts:QUESTION_PTS,
        ctx:'<div class="memo">The same '+fmt(RECOVERY)+' was entered twice on posting day: once as recovery <b>income</b>, once as the <b>loss-recovery component</b> of the reinsurance asset.</div>',
        q:'Which statement does each belong to?',
        options:[
          {t:'The income sits in P&L on the recovery lines; the component sits on the balance sheet, inside the reinsurance asset',ok:true,why:'The same amount in two places. <strong>The recovery lines</strong> are P&amp;L income on the treaty held. The <strong>loss-recovery component</strong> is in the asset for remaining coverage on the balance sheet (paragraph 66B). It tracks the recovery, so the later releases are presented as reversals. Interest is shown separately, in reinsurance finance income.'},
          {t:'Both are P&L: the component is just the contra-entry to the income',why:'The loss-recovery component is a balance, not a line of income. It is the asset side of the same entry.'},
          {t:'Both are balance-sheet: the recovery is an asset movement until it reverses',why:'The loss-recovery component <em>is</em> an asset balance, but recognizing it puts income through P&L in the same period as the loss (paragraph 66A). That is the point.'}],
        cite:['66A','66B']},fresh);
      placed=true;P.where=1;save();
      if(fresh&&count()<3)setObjective('Objective: close the case <b>'+count()+'/3</b>');
      maybeEnd();},
    meaning:async(g)=>{
      if(g.classList.contains('done'))return;
      await talk(sc,[
        {w:'cfo',n:'M. Brandt · CFO',t:'“Here is my question, then. Three years of recovery lines and they sum to zero. So the treaty did nothing for the accounts. Was Odermatt’s January masterpiece worthless?”'},
      ]);
      await quiz({kicker:'What the zero proves',pts:QUESTION_PTS,
        ctx:'<div class="memo"><strong>What this treaty actually did.</strong> The recovery lines recognized <b>'+fmt(sumIn)+'</b> and reversed <b>'+fmt(Math.abs(sumOut))+'</b>, so they sum to <b>zero</b> over the life of the case. Separately, the treaty CSM stands at <b>'+fmt(CEDED_CSM_END)+'</b>, none of it put there by these lines, and it pays real claim recoveries when the claims arrive.</div>',
        q:'Brandt says the lifetime zero shows the reinsurance was worthless. What is wrong with that?',
        options:[
          {t:'It confuses the recovery lines with the treaty’s profit. The zero is about timing; the value of the cover is elsewhere',ok:true,why:'The recovery lines put the recovery in the <strong>same period</strong> as the loss. Without them the benefit would only come through the treaty CSM, spread across the cover, and the books would show the loss in one year and the recovery in another. Preventing that mismatch is the whole job, and a timing device sums to zero over a life. What the cover is worth sits elsewhere: '+fmt(CEDED_CSM_END)+' of treaty CSM, and the real recoveries paid when the claims arrive.'},
          {t:'Nothing is wrong: a lifetime zero does mean no economic benefit',why:'By that logic every accrual would be worthless. The zero is about presentation, not about the contract.'},
          {t:'It is wrong because the interest accretion makes the true total positive',why:'The interest is inside the reversals as well. The total is zero including it. The answer is about what the lines are <em>for</em>, not the arithmetic.'}],
        cite:['66A','B119D']},fresh);
      meant=true;P.meaning=1;save();
      if(fresh&&count()<3)setObjective('Objective: close the case <b>'+count()+'/3</b>');
      maybeEnd();},
  });
  if(fresh){
    const mk=id=>{const g=[...sc.querySelectorAll('.hs')].find(h=>h.dataset.hs===id);if(g)g.classList.add('done');};
    if(weighed){mk('weigh');level();} if(placed)mk('where'); if(meant)mk('meaning');
    if(count()&&count()<3)setObjective('Objective: close the case <b>'+count()+'/3</b>');
  } else {level();doorOut(sc,'Back to the case file →');}
}
/* ================= end ================= */
function endOverlay(){
  /* the case does not close on the seven meetings alone: the year-five offer comes first */
  if(!S.capstoneDone){
    const card=el('div','mcard');
    card.append(el('div','qk','Case almost closed · mastery '+S.score+'/100'));
    card.append(el('div','grade','Last thing: the offer on the renewal desk.'));
    card.insertAdjacentHTML('beforeend','<p>You took both cases through all ten meetings, and both lifetime schedules add up to zero. One last challenge: in year five Odermatt offers a cheap stop-loss, a treaty <strong>the mirror was never built for</strong>. One call, worth 16 mastery points, closes the case.</p>');
    const f=el('div','mfoot');
    const later=el('button','cta ghost','Back to the case file');later.onclick=()=>{closeModal();renderMap();};
    const go=el('button','cta big','Hear the offer');go.onclick=()=>{closeModal();runCapstones();};
    f.append(later,go);card.append(f);
    openModal(card,true);save();return;
  }
  const card=el('div','mcard');
  const grade=S.score>=100?'Full marks. The case is mastered.':S.score>=85?'A strong file, with a few findings still open.':S.score>=60?'Most of it is there. The audit file shows where to look.':'A first pass. The retake is open.';
  card.append(el('div','qk','Case closed · mastery '+S.score+'/100'));
  card.append(el('div','grade',grade));
  card.append(el('p','','At Limmat you booked a loss the day you found it (paragraph 47), kept it out of a better group (paragraph 16), and priced the recovery against its cost. At Clearbook you watched a CSM run out (paragraphs 47 to 48), refused to book a recovery on a treaty linked to nothing, explained why cover bought after a loss recovers none of it (B119C), worked out what the treaty covers and by how much (B119E), showed the mirrored income does not depend on which fleet carried the loss (B119D), posted both entries, split the 2027 review the way the standard does (paragraphs 66B and 66(c)), and ran both books off to zero. Then you turned down the one treaty the mirror cannot measure. Every meeting can be replayed with nothing at stake, and the ⓘ case card lists every paragraph.'));
  const rules=el('div','rules');
  rules.innerHTML=['16','47–48','44','45','66A','66B','B119C','B119D','B119E','B119F','66(c)','86'].map(citeChip).join('');
  card.append(rules);
  const R=(!S.drillDue)?retakeList():[];
  if(R.length)card.insertAdjacentHTML('beforeend','<p class="fy">Retake: answer the '+R.length+' question'+(R.length>1?'s':'')+' you missed, all correct in one sitting, then finish the numbers drill, and the '+R.reduce((t,r)=>t+(r.p||QUESTION_PTS),0)+' points those findings carry come back.</p>');
  if(S.drillDue)card.insertAdjacentHTML('beforeend','<p class="fy">Retake cleared. One step left: finish the numbers drill, nothing at stake, and the points come back.</p>');
  if(S.score>=100)card.insertAdjacentHTML('beforeend','<p class="fy">Before you go: click any number in the top bar to see its full history, movement by movement. The recovery P&amp;L one is the shortest and the most worth reading.</p>');
  const f=el('div','mfoot');
  const again=el('button','cta ghost','Play again');
  again.onclick=()=>{S=freshState();ledgerFromState();renderChips();setAudit();save();tokenAt='slip';closeModal();renderMap();};
  const map=el('button','cta'+(R.length?'':' big'),'Back to the case file');
  map.onclick=()=>{closeModal();renderMap();};
  f.append(again,map);
  if(R.length){const rt=el('button','cta big','Retake what you missed');rt.onclick=()=>{closeModal();runRetake(R);};f.append(rt);}
  if(S.drillDue){const dd=el('button','cta big','Finish the numbers drill');dd.onclick=()=>{closeModal();runDrill();};f.append(dd);}
  card.append(f);
  openModal(card,true);
  save();
}
/* ================= boot ================= */
const ROOM_FNS={slip:stationSlip,desk:stationDesk,shortyear:stationShortyear,
  renewal:stationRenewal,booking:stationBooking,workpaper:stationWorkpaper,
  mirror:stationMirror,posting:stationPosting,runoff:stationRunoff,audit:stationAudit};
function onRestart(){tokenAt='slip';}
bootShell();
/* a run is only finished once the year-five offer is answered too */
if(S.started&&Object.keys(S.done).length>0&&!(S.done.audit&&S.capstoneDone)){renderMap();}
else titleScreen();
</script>
